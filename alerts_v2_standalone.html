<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuppVerse BD — Alerts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ===== Tokens ===== */
  :root {
    --purple: #7C6FF7; --purple-glow: rgba(124,111,247,0.35);
    --danger: #D95353; --warning: #F4A922; --success: #2F9B68; --info: #0891B2;
    --warning-txt: #C27808;

    --page-bg: #EEF0F4;
    --card-bg: #FFFFFF;
    --card-border: #E7E9EF;
    --card-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 10px 28px rgba(15,23,42,0.06);
    --txt: #0B1220;
    --muted: #8A90A0;
    --muted-2: #B2B7C2;
    --track: rgba(11,18,32,0.07);
    --sku-c: #0891B2;
    --ghost-border: #DCE0E8;
    --divider: #EEF0F4;
    --surf-2: #F7F8FA;
  }
  html[data-theme="dark"] {
    --page-bg: #0A0D14;
    --card-bg: #141824;
    --card-border: #232838;
    --card-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 14px 32px rgba(0,0,0,0.45);
    --txt: #F3F5F9;
    --muted: #8C93A6;
    --muted-2: #565D70;
    --track: rgba(255,255,255,0.08);
    --sku-c: #35B4CE;
    --ghost-border: #2B3244;
    --divider: #1E2330;
    --surf-2: #1A1F2C;
  }

  /* ===== Glass tones (sentiment-tinted cards, derived from the app's own warning/danger/success hues) ===== */
  .glass-shadow {
    box-shadow: 0 4px 6px rgba(0,0,0,0.05), 0 10px 22px rgba(0,0,0,0.08), inset 0 1px 1px rgba(255,255,255,0.8);
  }
  html[data-theme="dark"] .glass-shadow {
    box-shadow: 0 4px 6px rgba(0,0,0,0.3), 0 10px 24px rgba(0,0,0,0.42), inset 0 1px 1px rgba(255,255,255,0.08), 0 0 0 1px rgba(255,255,255,0.04);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .tone-warning { background: #FEF6E9; border: 2px solid #FBE3B8; }
  .tone-danger  { background: #FBEEEE; border: 2px solid #F3C8C8; }
  .tone-success { background: #EAF5F0; border: 2px solid #BCDFCF; }
  .tone-order   { background: #F2F1FE; border: 2px solid #D5D1FC; }
  .tone-proxy   { background: #FEF0EA; border: 2px solid #FBCAB9; }
  html[data-theme="dark"] .tone-warning { background: rgba(93,64,13,0.55); border-color: rgba(166,115,23,0.5); }
  html[data-theme="dark"] .tone-danger  { background: rgba(82,32,32,0.55); border-color: rgba(148,56,56,0.5); }
  html[data-theme="dark"] .tone-success { background: rgba(18,59,40,0.55); border-color: rgba(32,105,71,0.5); }
  html[data-theme="dark"] .tone-order   { background: rgba(56,50,111,0.55); border-color: rgba(99,89,198,0.5); }
  html[data-theme="dark"] .tone-proxy   { background: rgba(109,45,22,0.55); border-color: rgba(198,82,39,0.5); }

  .tone-warning .actions-row { border-top-color: rgba(166,115,23,0.22); }
  .tone-danger  .actions-row { border-top-color: rgba(148,56,56,0.22); }
  .tone-success .actions-row { border-top-color: rgba(32,105,71,0.22); }
  .tone-order   .actions-row { border-top-color: rgba(99,89,198,0.22); }
  .tone-proxy   .actions-row { border-top-color: rgba(198,82,39,0.22); }
  html[data-theme="dark"] .tone-warning .actions-row { border-top-color: rgba(251,227,184,0.14); }
  html[data-theme="dark"] .tone-danger  .actions-row { border-top-color: rgba(243,200,200,0.14); }
  html[data-theme="dark"] .tone-success .actions-row { border-top-color: rgba(188,223,207,0.14); }
  html[data-theme="dark"] .tone-order   .actions-row { border-top-color: rgba(213,209,252,0.14); }
  html[data-theme="dark"] .tone-proxy   .actions-row { border-top-color: rgba(251,202,185,0.16); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--page-bg);
    min-height: 100vh;
    padding: 32px 18px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background-color .35s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
  button { font-family: inherit; cursor: pointer; }

  /* ===== Header / toggle ===== */
  .stage { width: 100%; max-width: 400px; }
  .stage-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px; padding: 0 2px;
  }
  .stage-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 15px; color: var(--txt); letter-spacing: -0.01em; }
  .stage-sub { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 2px; }

  .theme-toggle {
    position: relative; width: 52px; height: 30px; border-radius: 999px;
    border: 1px solid var(--card-border); background: var(--surf-2);
    display: flex; align-items: center; padding: 3px; flex-shrink: 0;
    transition: background-color .3s ease, border-color .3s ease;
  }
  .theme-toggle:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .theme-toggle .knob {
    width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(145deg,#8f83ff,var(--purple));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px var(--purple-glow);
    transform: translateX(0);
    transition: transform .3s cubic-bezier(.4,0,.2,1);
  }
  html[data-theme="dark"] .theme-toggle .knob { transform: translateX(22px); }
  .theme-toggle svg { width: 12px; height: 12px; }

  /* ===== Card list ===== */
  .cards-wrap { display: flex; flex-direction: column; gap: 12px; }

  .alert-card {
    border-radius: 18px;
    padding: 14px 15px 13px;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(10px);
    animation: cardIn .5s cubic-bezier(.16,1,.3,1) forwards;
    transition: background-color .35s ease, border-color .35s ease, min-height .2s ease, box-shadow .35s ease;
    display: flex;
    flex-direction: column;
  }
  .alert-card:nth-child(1) { animation-delay: .03s; }
  .alert-card:nth-child(2) { animation-delay: .10s; }
  .alert-card:nth-child(3) { animation-delay: .17s; }
  @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

  .card-top { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  .icon-chip {
    width: 29px; height: 29px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .card-label-col { flex: 1; min-width: 0; }
  .card-label {
    font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 11px;
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .card-time { font-size: 10.5px; font-weight: 600; color: var(--muted-2); margin-top: 1px; }

  .pulse-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--danger); flex-shrink: 0;
    box-shadow: 0 0 0 0 rgba(217,83,83,0.6);
    animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(217,83,83,0.45); }
    70% { box-shadow: 0 0 0 7px rgba(217,83,83,0); }
    100% { box-shadow: 0 0 0 0 rgba(217,83,83,0); }
  }

  .product-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .product-name { font-size: 14px; font-weight: 700; color: var(--txt); line-height: 1.25; margin-bottom: 2px; }
  .product-sku { font-family: 'Courier Prime', 'Courier New', monospace; font-size: 10px; font-weight: 700; color: var(--sku-c); letter-spacing: 0.08em; text-transform: uppercase; }

  .status-badge { font-size: 10px; font-weight: 800; padding: 3px 9px; border-radius: 999px; flex-shrink: 0; white-space: nowrap; }

  /* Order ID badge — LOCKED spec, do not modify without explicit request */
  .order-id-badge {
    font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 11px;
    color: #7C6FF7; background: rgba(124,111,247,0.12);
    border: 1px solid rgba(124,111,247,0.38); border-radius: 6px;
    padding: 2px 7px; letter-spacing: 0.3px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  html[data-theme="dark"] .order-id-badge { background: rgba(124,111,247,0.18); border-color: rgba(124,111,247,0.5); }

  /* Return ID badge — same pill language as Order ID, recolored red */
  .return-id-badge {
    font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 11px;
    color: #D95353; background: rgba(217,83,83,0.12);
    border: 1px solid rgba(217,83,83,0.38); border-radius: 6px;
    padding: 2px 7px; letter-spacing: 0.3px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  html[data-theme="dark"] .return-id-badge { background: rgba(217,83,83,0.18); border-color: rgba(217,83,83,0.5); }

  /* Small reference tag — links a card back to its original order */
  .ref-order-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; color: var(--muted); }
  .ref-order-tag .order-id-badge { font-size: 10px; padding: 1.5px 6px; }

  /* Tracking ID tag — borrowed from the Buy For Me page's own dashed tracking box */
  .tracking-tag {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,0.55); border: 1.5px dashed rgba(198,82,39,0.45);
    border-radius: 8px; padding: 3px 8px; flex-shrink: 0;
  }
  html[data-theme="dark"] .tracking-tag { background: rgba(255,255,255,0.06); border-color: rgba(251,202,185,0.4); }
  .tracking-tag .tt-label { font-size: 8.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .tracking-tag .tt-val { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11.5px; font-weight: 800; color: #E15A26; letter-spacing: 0.4px; }
  html[data-theme="dark"] .tracking-tag .tt-val { color: #FF9466; }

  /* Buy For Me item row */
  .proxy-item-block { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; padding: 10px 12px; background: rgba(255,255,255,0.5); border-radius: 12px; gap: 10px; }
  html[data-theme="dark"] .proxy-item-block { background: rgba(255,255,255,0.05); }
  .proxy-item-name { font-size: 12px; font-weight: 700; color: var(--txt); line-height: 1.3; }
  .proxy-item-store { font-size: 10.5px; font-weight: 600; color: var(--muted); margin-top: 2px; }
  .proxy-item-price { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 800; color: var(--success); flex-shrink: 0; text-align: right; }
  .proxy-item-qty { font-size: 10px; font-weight: 600; color: var(--muted); text-align: right; margin-top: 2px; }

  /* New Order card */
  .customer-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .customer-name { font-size: 14px; font-weight: 700; color: var(--txt); line-height: 1.25; margin-bottom: 2px; }
  .customer-phone { font-size: 11px; font-weight: 600; color: var(--muted); }

  .order-summary-block { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; padding: 10px 12px; background: rgba(255,255,255,0.5); border-radius: 12px; }
  html[data-theme="dark"] .order-summary-block { background: rgba(255,255,255,0.05); }
  .order-total { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 19px; font-weight: 800; color: var(--txt); line-height: 1; }
  .order-total-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 3px; }
  .order-items-meta { text-align: right; font-size: 11px; font-weight: 600; color: var(--muted); }
  .order-items-meta strong { display: block; color: var(--txt); font-size: 12px; font-weight: 700; margin-bottom: 2px; }

  /* Source corner glow — soft gradient wash in the top-right corner, indicating where a payment originated */
  .tone-success.glow-local {
    background: radial-gradient(170px 170px at 100% 0%, rgba(10,155,220,0.5), transparent 68%), #EAF5F0;
  }
  .tone-success.glow-proxy {
    background: radial-gradient(170px 170px at 100% 0%, rgba(242,100,48,0.5), transparent 68%), #EAF5F0;
  }
  html[data-theme="dark"] .tone-success.glow-local {
    background: radial-gradient(170px 170px at 100% 0%, rgba(28,179,238,0.5), transparent 68%), rgba(18,59,40,0.55);
  }
  html[data-theme="dark"] .tone-success.glow-proxy {
    background: radial-gradient(170px 170px at 100% 0%, rgba(255,138,92,0.5), transparent 68%), rgba(18,59,40,0.55);
  }

  /* Payment summary block */
  .payment-summary-block { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; padding: 10px 12px; background: rgba(255,255,255,0.5); border-radius: 12px; }
  html[data-theme="dark"] .payment-summary-block { background: rgba(255,255,255,0.05); }
  .payment-amount { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 800; color: var(--success); line-height: 1; }
  .payment-amount-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 3px; }
  .payment-meta { text-align: right; font-size: 11px; font-weight: 600; color: var(--muted); }
  .payment-meta strong { display: block; color: var(--txt); font-size: 12px; font-weight: 700; margin-bottom: 2px; }

  /* meter */
  .meter-block { margin-bottom: 9px; }
  .meter-labels { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .meter-labels strong { font-weight: 800; }
  .meter-track { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; position: relative; }
  .meter-fill { height: 100%; border-radius: 999px; }

  .meter-track.empty-track { position: relative; background: rgba(217,83,83,0.14); }
  .meter-fill.empty-fill {
    position: relative; box-shadow: 0 0 10px 1px rgba(217,83,83,0.7);
  }
  .meter-fill.empty-fill::after {
    content: ""; position: absolute; top: -3px; right: -3px; bottom: -3px; width: 3px;
    border-radius: 999px; background: var(--danger);
  }

  /* chips */
  .chips-row { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 9px; }
  .chip { display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; color: var(--muted); }
  .chip strong { font-weight: 800; }
  .chip svg { flex-shrink: 0; }

  /* actions */
  .actions-row { display: flex; gap: 7px; padding-top: 11px; margin-top: auto; border-top: 1px solid var(--divider); }
  .action-btn {
    height: 32px; border-radius: 10px; font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; flex: 1 1 0; min-width: 0; padding: 0 10px; border: none;
    transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease;
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .action-btn.primary { background: var(--purple); color: #fff; box-shadow: 0 4px 12px var(--purple-glow); }
  .action-btn.ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--ghost-border); }
  .action-btn.amber { background: var(--warning); color: #fff; box-shadow: 0 4px 12px rgba(244,169,34,0.35); }
  .action-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>

<div class="stage">
  <div class="stage-head">
    <div>
      <div class="stage-title">Alerts</div>
      <div class="stage-sub">10 needing attention</div>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle day/night mode">
      <div class="knob" id="knob">
        <svg id="knobIcon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></svg>
      </div>
    </button>
  </div>

  <div class="cards-wrap" id="cards"></div>
</div>

<script>
const ICONS = {
  box:      `<path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>`,
  alertTri: `<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>`,
  calendar: `<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>`,
  calendarX: `<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="9.5" y1="14" x2="14.5" y2="19"/><line x1="14.5" y1="14" x2="9.5" y2="19"/>`,

  barChart: `<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>`,

  history:  `<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>`,
  bag:      `<path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>`,
  phone:    `<path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>`,
  storefront: `<path d="M3 9l1-5h16l1 5"/><path d="M3 9a2 2 0 004 0 2 2 0 004 0 2 2 0 004 0 2 2 0 004 0"/><path d="M4 9v10h16V9"/>`,
  link:     `<path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>`,
  send:     `<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>`,
  wallet:   `<path d="M20 12V8H6a2 2 0 010-4h12v4"/><path d="M4 6v12a2 2 0 002 2h14v-4"/><path d="M18 12a2 2 0 000 4h4v-4z"/>`,
  receipt:  `<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="12" y2="15"/>`,

function icon(name, sz, c, w) {
  return `<svg width="${sz||14}" height="${sz||14}" viewBox="0 0 24 24" fill="none" stroke="${c||'currentColor'}" stroke-width="${w||2}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;
}

const SEVERITY = {
  warning: { accent: 'var(--warning)', labelColor: 'var(--warning-txt)', chipBg: 'rgba(244,169,34,0.22)', tone: 'tone-warning' },
  critical:{ accent: 'var(--danger)',  labelColor: 'var(--danger)',      chipBg: 'rgba(217,83,83,0.20)',  tone: 'tone-danger' },
  success: { accent: 'var(--success)', labelColor: 'var(--success)',    chipBg: 'rgba(47,155,104,0.20)',  tone: 'tone-success' },
  order:   { accent: 'var(--purple)',  labelColor: 'var(--purple)',     chipBg: 'rgba(124,111,247,0.20)', tone: 'tone-order' },
  proxy:   { accent: '#E15A26',        labelColor: '#E15A26',           chipBg: 'rgba(226,90,38,0.20)',   tone: 'tone-proxy' },
};

function actionBtn(cls, iconName, label) {
  const iconColor = cls === 'ghost' ? 'var(--muted)' : '#fff';
  return `<button class="action-btn ${cls}">${icon(iconName, 13, iconColor, 2.5)}<span>${label}</span></button>`;
}

function chip(iconName, text, value, color) {
  const c = color || 'var(--txt)';
  return `<span class="chip">${icon(iconName, 11, 'var(--muted)', 2)}<span>${text}</span>${value ? `<strong style="color:${c}">${value}</strong>` : ''}</span>`;
}

/* ---- Equal card heights, regardless of content length (grouped by card type) ---- */
function equalizeCardHeights() {
  const groups = {};
  document.querySelectorAll('.alert-card').forEach(c => {
    c.style.minHeight = '0px';
    const g = c.getAttribute('data-group');
    (groups[g] = groups[g] || []).push(c);
  });
  Object.values(groups).forEach(cards => {
    let max = 0;
    cards.forEach(c => { max = Math.max(max, c.getBoundingClientRect().height); });
    cards.forEach(c => { c.style.minHeight = max + 'px'; });
  });
}
equalizeCardHeights();
window.addEventListener('load', equalizeCardHeights);
window.addEventListener('resize', equalizeCardHeights);
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(equalizeCardHeights); }

/* ---- Theme toggle ---- */
const root = document.documentElement;
const toggle = document.getElementById('themeToggle');
const knobIcon = document.getElementById('knobIcon');
function paintKnobIcon() {
  const dark = root.getAttribute('data-theme') === 'dark';
  knobIcon.innerHTML = ICONS[dark ? 'moon' : 'sun'];
}
paintKnobIcon();
toggle.addEventListener('click', () => {
  const isDark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  paintKnobIcon();
});
</script>
