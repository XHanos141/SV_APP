<!DOCTYPE html>
<html lang="en">
<head>
<script src="assets/js/sv-theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unified Inbox · SuppVerse BD</title>
<style>
  :root{
    --body-bg:#0f1621;
    --surface:#162130;
    --surface-2:#1d2c3e;
    --hairline:rgba(255,255,255,0.07);
    --text-1:#eaf2f8;
    --text-2:#9fb0c3;
    --text-3:#657386;
    --cyan:#009ddc;
    --purple:#6761a8;
    --green:#009b72;
    --orange:#f26430;
    --red:#d95353;

    --fb:#1877F2;
    --ig-a:#F58529;
    --ig-b:#DD2A7B;
    --ig-c:#8134AF;
    --wa:#25D366;

    --font-head:'Plus Jakarta Sans', system-ui, sans-serif;
    --font-body:'DM Sans', system-ui, sans-serif;
  }

  html[data-theme="light"]{
    --body-bg:#f4f6f9;
    --surface:#ffffff;
    --surface-2:#eef1f6;
    --hairline:rgba(15,22,33,0.08);
    --text-1:#101722;
    --text-2:#57657a;
    --text-3:#8a96a8;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; background:var(--body-bg); }
  body{
    font-family:var(--font-body);
    color:var(--text-1);
    display:flex;
    justify-content:center;
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ transition:none !important; animation:none !important; }
  }

  a,button{ font-family:inherit; }
  button{ background:none; border:none; color:inherit; cursor:pointer; padding:0; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--cyan);
    outline-offset:2px;
    border-radius:6px;
  }

  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--body-bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Header (matches Admin Panel / Voucher Hub navy bar) ---------- */
  .inbox-header{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--body-bg);
    padding:0;
    border-bottom:1px solid var(--hairline);
  }
  .inbox-header__top{
    display:flex;
    align-items:center;
    gap:12px;
    height:58px;
    padding:0 20px;
    margin:0 0 14px;
    color:#fff;
    background:linear-gradient(180deg,#0f3258 0%,#002248 22%,#001f3c 55%,#001532 82%,#000d20 100%);
    box-shadow:0 6px 28px rgba(0,0,0,.35);
  }
  .inbox-header__body{ padding:0 16px; }
  .inbox-back-btn{
    width:36px; height:36px; border-radius:10px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.08); color:#fff;
    display:none; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .inbox-back-btn svg{ width:20px; height:20px; }
  html.is-embedded .inbox-back-btn{ display:flex; }
  .inbox-header__title{
    font-family:var(--font-head);
    font-weight:800;
    font-size:16px;
    letter-spacing:-0.2px;
    margin:0;
    flex:1;
    min-width:0;
    color:#fff;
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .bell-btn{
    position:relative;
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.08);
    color:#fff;
  }
  .bell-btn svg{ width:20px; height:20px; }
  .bell-dot{
    position:absolute;
    top:6px;
    right:7px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--orange);
    border:2px solid #001f3c;
  }

  .search-wrap{
    position:relative;
    margin-bottom:14px;
  }
  .search-wrap svg{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    color:var(--text-3);
    pointer-events:none;
  }
  #searchInput{
    width:100%;
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:11px;
    padding:11px 14px 11px 38px;
    font-size:14.5px;
    color:var(--text-1);
    font-family:var(--font-body);
  }
  #searchInput::placeholder{ color:var(--text-3); }

  /* ---------- Filter tabs (underline, messaging-app style) ---------- */
  .filter-tabs{
    display:flex;
    gap:22px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:0;
  }
  .filter-tabs::-webkit-scrollbar{ display:none; }
  .filter-tab{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13.5px;
    font-weight:600;
    color:var(--text-3);
    padding:0 2px 10px;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .filter-tab-icon{
    width:18px;
    height:18px;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .filter-tab-icon svg{ width:10.5px; height:10.5px; }
  .filter-tab-icon.fb{ background:var(--fb); }
  .filter-tab-icon.wa{ background:var(--wa); }
  .filter-tab-icon.ig{ background:linear-gradient(135deg, var(--ig-a), var(--ig-b) 55%, var(--ig-c)); }
  .filter-tab-icon.all{
    background:var(--surface-2);
    color:var(--text-2);
  }
  .filter-tab-icon.all svg{ width:12px; height:12px; }
  .filter-tab[aria-selected="true"] .filter-tab-icon.all{ background:var(--cyan); color:#fff; }
  .filter-tab[aria-selected="true"]{
    color:var(--text-1);
    border-bottom-color:var(--cyan);
  }
  .filter-tab .count{
    color:var(--text-3);
    font-weight:500;
    margin-left:4px;
  }
  .filter-tab[aria-selected="true"] .count{ color:var(--cyan); }

  /* ---------- Status filters (primary, filled pills) ---------- */
  .status-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
    margin-bottom:12px;
  }
  .status-tabs::-webkit-scrollbar{ display:none; }
  .status-tab{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:700;
    font-family:var(--font-head);
    color:var(--text-2);
    background:var(--surface-2);
    border:1px solid var(--hairline);
    padding:7px 13px;
    border-radius:20px;
    white-space:nowrap;
  }
  .status-tab .count{
    color:var(--text-3);
    font-weight:600;
  }
  .status-tab[aria-selected="true"]{
    color:#fff;
    background:var(--cyan);
    border-color:var(--cyan);
  }
  .status-tab[aria-selected="true"] .count{ color:rgba(255,255,255,0.85); }

  /* ---------- Conversation list ---------- */
  .conv-list{
    flex:1;
    overflow-y:auto;
    padding-bottom:140px; /* clears bottom nav + FAB */
  }
  .conv-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 16px;
    border-bottom:1px solid var(--hairline);
    width:100%;
    text-align:left;
  }
  .conv-row:hover{ background:var(--surface); }
  .conv-row.is-unread{ background:rgba(0,157,220,0.05); }

  .unread-dot{
    flex:0 0 auto;
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--cyan);
    opacity:0;
  }
  .conv-row.is-unread .unread-dot{ opacity:1; }

  .avatar-wrap{
    position:relative;
    flex:0 0 auto;
    width:46px;
    height:46px;
  }
  .avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    background:var(--surface-2);
  }
  .avatar-initials{
    width:46px;
    height:46px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-head);
    font-weight:700;
    font-size:15px;
    color:#fff;
  }
  .channel-badge{
    position:absolute;
    bottom:-2px;
    right:-2px;
    width:18px;
    height:18px;
    border-radius:50%;
    border:2.5px solid var(--body-bg);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .channel-badge svg{ width:9px; height:9px; }
  .channel-badge.messenger{ background:var(--fb); }
  .channel-badge.whatsapp{ background:var(--wa); }
  .channel-badge.instagram{
    background:linear-gradient(135deg, var(--ig-a), var(--ig-b) 55%, var(--ig-c));
  }

  .conv-main{
    flex:1;
    min-width:0;
  }
  .conv-main__top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
  }
  .conv-name{
    font-family:var(--font-head);
    font-size:14.5px;
    font-weight:600;
    color:var(--text-2);
    display:inline-flex;
    align-items:center;
    gap:4px;
    min-width:0;
    overflow:hidden;
  }
  .conv-name span{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .conv-name .name-verified-badge{
    width:15px;
    height:15px;
    flex:0 0 auto;
  }
  .is-unread .conv-name{ color:var(--text-1); font-weight:700; }
  .conv-time{
    flex:0 0 auto;
    font-size:11.5px;
    color:var(--text-3);
  }
  .is-unread .conv-time{ color:var(--cyan); font-weight:600; }
  .conv-snippet{
    margin-top:2px;
    font-size:13px;
    color:var(--text-3);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .is-unread .conv-snippet{ color:var(--text-2); font-weight:500; }

  .empty-state{
    padding:70px 32px 0;
    text-align:center;
    color:var(--text-3);
  }
  .empty-state svg{ width:34px; height:34px; margin-bottom:14px; color:var(--text-3); }
  .empty-state p{ margin:0; font-size:13.5px; line-height:1.5; }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;
    max-width:448px;
    width:calc(100% - 32px);
    margin:0 auto;
    left:0; right:0;
    bottom:94px;
    display:flex;
    justify-content:flex-end;
    pointer-events:none;
    z-index:25;
  }
  .fab button{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--cyan);
    color:#fff;
    font-weight:600;
    font-size:13.5px;
    padding:13px 18px;
    border-radius:100px;
    box-shadow:0 8px 20px rgba(0,157,220,0.35);
    transition:transform 0.15s ease;
  }
  .fab button:active{ transform:scale(0.96); }
  .fab svg{ width:16px; height:16px; }

  /* ---------- FAB menu (customer type filter) ---------- */
  .fab-menu-backdrop{
    position:fixed;
    inset:0;
    z-index:29;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.15s ease;
  }
  .fab-menu-backdrop.open{ opacity:1; pointer-events:auto; }
  .fab-menu{
    position:fixed;
    max-width:448px;
    width:calc(100% - 32px);
    left:0; right:0;
    margin:0 auto;
    bottom:150px;
    z-index:30;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
    pointer-events:none;
  }
  .fab-menu-item{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:9px;
    background:var(--surface);
    border:1px solid var(--hairline);
    color:var(--text-1);
    font-size:13px;
    font-weight:600;
    padding:10px 14px;
    border-radius:12px;
    box-shadow:0 6px 18px rgba(0,0,0,0.3);
    opacity:0;
    transform:translateY(8px) scale(0.96);
    transition:opacity 0.16s ease, transform 0.16s ease;
  }
  .fab-menu.open .fab-menu-item{ opacity:1; transform:translateY(0) scale(1); }
  .fab-menu.open .fab-menu-item:nth-child(1){ transition-delay:0.02s; }
  .fab-menu.open .fab-menu-item:nth-child(2){ transition-delay:0.06s; }
  .fab-menu.open .fab-menu-item:nth-child(3){ transition-delay:0.1s; }
  .fab-menu-item[aria-pressed="true"]{
    background:rgba(0,157,220,0.12);
    border-color:var(--cyan);
    color:var(--cyan);
  }
  .fab-menu-item .dot{
    width:8px; height:8px; border-radius:50%;
    flex:0 0 auto;
  }
  .fab-menu-item .dot.registered{ background:#2fd88a; }
  .fab-menu-item .dot.guest{ background:var(--orange); }
  .fab-menu-item .dot.all{ background:var(--text-3); }
  .fab-main-btn.open svg{ transform:rotate(45deg); }
  .fab-main-btn svg{ transition:transform 0.2s ease; }
  .fab-filter-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--orange);
    position:absolute;
    top:9px; right:14px;
    border:2px solid var(--cyan);
    display:none;
  }
  .fab-filter-dot.show{ display:block; }

  /* ---------- Customers screen ---------- */
  #customersView{
    display:none;
    flex-direction:column;
    background:var(--body-bg);
    z-index:50;
  }
  #customersView:not([hidden]){
    display:flex;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    height:100dvh;
  }
  .cust-list-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-bottom:1px solid var(--hairline);
    flex:0 0 auto;
  }
  .cust-list-header h1{
    font-family:var(--font-head);
    font-size:17px;
    font-weight:700;
    color:var(--text-1);
    flex:1;
  }
  .cust-list-back{
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-2);
    border-radius:10px;
    flex:0 0 auto;
  }
  .cust-list-back svg{ width:20px; height:20px; }
  .cust-list-count{
    font-size:12px;
    font-weight:600;
    color:var(--text-3);
  }
  .cust-list-scroll{
    flex:1;
    overflow-y:auto;
    padding:10px 14px 24px;
  }
  .cust-list-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 8px;
    border-bottom:1px solid var(--hairline);
  }
  .cust-list-row__avatar{
    width:42px; height:42px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-head);
    font-weight:700;
    font-size:14px;
    color:#fff;
    flex:0 0 auto;
  }
  .cust-list-row__main{ flex:1; min-width:0; }
  .cust-list-row__name{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:14px;
    font-weight:700;
    color:var(--text-1);
  }
  .cust-list-row__name svg{ width:13px; height:13px; color:#2fd88a; flex:0 0 auto; }
  .cust-list-row__id{
    font-family:var(--font-head);
    font-size:11px;
    font-weight:800;
    color:#c4bdfd;
    background:rgba(124,111,247,0.18);
    border:1px solid rgba(124,111,247,0.4);
    border-radius:7px;
    padding:1px 7px;
    display:inline-block;
    margin-top:3px;
  }
  .cust-list-row__platforms{
    display:flex;
    align-items:center;
    gap:4px;
    flex:0 0 auto;
  }
  .cust-list-row__platforms span{
    width:18px; height:18px;
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
  }
  .cust-list-row__platforms svg{ width:10px; height:10px; }
  .cust-list-row__platforms .fb{ background:var(--fb); }
  .cust-list-row__platforms .wa{ background:var(--wa); }
  .cust-list-row__platforms .ig{ background:linear-gradient(135deg, var(--ig-a), var(--ig-b) 55%, var(--ig-c)); }
  .cust-list-empty{
    text-align:center;
    color:var(--text-3);
    font-size:13px;
    padding:60px 20px;
  }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed;
    bottom:0;
    left:0; right:0;
    max-width:480px;
    margin:0 auto;
    background:var(--surface);
    border-top:1px solid var(--hairline);
    display:flex;
    padding:9px 4px calc(9px + env(safe-area-inset-bottom));
    z-index:20;
  }
  .nav-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color:var(--text-3);
    padding:4px 0;
  }
  .nav-item svg{ width:21px; height:21px; }
  .nav-item span{ font-size:10px; font-weight:600; }
  .nav-item[aria-current="page"]{ color:var(--cyan); }

  @media (max-width:340px){
    .filter-tabs{ gap:16px; }
  }

  /* ---------- Thread / chat view ---------- */
  #threadView:not([hidden]){
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  .thread-header{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 12px;
    background:var(--body-bg);
    border-bottom:1px solid var(--hairline);
  }
  .thread-back, .thread-more{
    flex:0 0 auto;
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    color:var(--text-2);
  }
  .thread-back:hover, .thread-more:hover{ background:var(--surface); color:var(--text-1); }
  .thread-back svg{ width:19px; height:19px; }
  .thread-more svg{ width:17px; height:17px; }

  .thread-avatar-wrap{
    position:relative;
    flex:0 0 auto;
    width:38px;
    height:38px;
  }
  .thread-avatar-wrap .avatar,
  .thread-avatar-wrap .avatar-initials{
    width:38px;
    height:38px;
    font-size:13px;
  }
  .thread-avatar-wrap .channel-badge{
    width:15px;
    height:15px;
    border-width:2px;
  }
  .thread-avatar-wrap .channel-badge svg{ width:7.5px; height:7.5px; }

  .thread-identity{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  .thread-name{
    font-family:var(--font-head);
    font-weight:700;
    font-size:15px;
    color:var(--text-1);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .thread-channel{
    font-size:11.5px;
    font-weight:600;
    margin-top:1px;
  }
  .thread-channel.messenger{ color:var(--fb); }
  .thread-channel.whatsapp{ color:var(--wa); }
  .thread-channel.instagram{
    background:linear-gradient(90deg, var(--ig-a), var(--ig-b), var(--ig-c));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  /* ---------- Identity row (multi-platform indicator, opens customer panel) ---------- */
  .identity-row{
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:2px;
  }
  .identity-chip{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:11px;
    font-weight:700;
    color:var(--text-2);
    background:var(--surface-2);
    border:1px solid var(--hairline);
    border-radius:100px;
    padding:2px 8px 2px 4px;
  }
  .identity-chip .mini-badges{
    display:flex;
    align-items:center;
  }
  .identity-chip .mini-badges span{
    width:13px;
    height:13px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1.5px solid var(--surface-2);
    margin-left:-4px;
  }
  .identity-chip .mini-badges span:first-child{ margin-left:0; }
  .identity-chip .mini-badges svg{ width:7px; height:7px; }
  .identity-chip .mini-badges .fb{ background:var(--fb); }
  .identity-chip .mini-badges .wa{ background:var(--wa); }
  .identity-chip .mini-badges .ig{ background:linear-gradient(135deg, var(--ig-a), var(--ig-b) 55%, var(--ig-c)); }
  .identity-chip.guest{ color:var(--text-3); }

  /* ---------- Customer panel (bottom sheet on mobile) ---------- */
  .cust-sheet-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .cust-sheet-backdrop.open{ opacity:1; pointer-events:auto; }
  .cust-sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    max-height:88vh;
    max-height:88dvh;
    background:var(--surface);
    border-radius:20px 20px 0 0;
    z-index:61;
    display:flex;
    flex-direction:column;
    transform:translateY(100%);
    visibility:hidden;

  .cs-copy{

  }
  .cs-copy svg{ width:14px; height:14px; }
  .cs-copy:active{ transform:scale(.96); }
  .cs-copy.copied{ background:rgba(0,155,114,.14); color:var(--green); }

  .platform-row.active{ background:rgba(0,157,220,.07); }
  .platform-row__text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .platform-row__text .platform-row__label{ flex:none; }
  .platform-row__ident{ font-size:11.5px; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .order-card--btn{ display:block; width:100%; text-align:left; cursor:pointer; color:inherit; transition:border-color .15s, background .15s; }

  .order-row{

  .oc-card__right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }

  .cs-linkbtn{

  .cs-chip button{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:inherit; opacity:.85; flex:0 0 auto; }

  .cs-chip button svg{ width:13px; height:13px; }

  .cs-chip--add svg{ width:13px; height:13px; }

  .cs-chip--input{ padding:0 4px 0 12px; background:var(--surface-2); }

  .cs-inline-empty{ font-size:12.5px; color:var(--text-3); }

  .cs-notes__head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin:18px 0 8px; }
  .cs-notes__head .cust-sheet__section-label{ margin:0; }
  .cs-private{
    display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; color:var(--orange);
    background:rgba(242,100,48,.12); padding:3px 9px; border-radius:100px;
  }
  .cs-private svg{ width:11px; height:11px; }

  .cs-note__text{ font-size:13px; color:var(--text-1); white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.45; }
  .cs-note__time{ font-size:11px; color:var(--text-3); margin-top:6px; }
  .cs-note-form textarea{
    width:100%; min-height:88px; resize:vertical; border-radius:12px; padding:10px 12px;
    background:var(--surface-2); border:1px solid var(--hairline); color:var(--text-1); font:inherit; font-size:16px; line-height:1.4;
  }
  .cs-note-form textarea:focus-visible{ outline:none; border-color:var(--cyan); }
  .cs-note-form__row{ display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:8px; }

    font-weight:700; font-size:13px; border:1px solid var(--hairline); background:var(--surface-2); color:var(--text-1);
  }

  .cs-btn--primary{ background:var(--cyan); border-color:var(--cyan); color:#fff; }
  .cs-btn--block{ width:100%; }
  .cs-btn[disabled]{ opacity:.5; cursor:not-allowed; }
  .cs-btn.copied{ border-color:var(--green); color:var(--green); }

  .cs-detail__kind{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); margin-bottom:6px; }

  .cs-dl{ background:var(--surface-2); border:1px solid var(--hairline); border-radius:14px; overflow:hidden; margin-bottom:14px; }
  .cs-dl__row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-top:1px solid var(--hairline); font-size:13px; }

  .cs-dl__v{ color:var(--text-1); text-align:right; min-width:0; overflow-wrap:anywhere; }
  .cs-dl__v.muted{ color:var(--text-3); font-style:italic; }
  .cs-stack{ display:flex; flex-direction:column; gap:8px; }
  .cs-fineprint{ font-size:11.5px; color:var(--text-3); text-align:center; margin-top:10px; line-height:1.4; }

  .cust-sheet.is-full{ max-height:100vh; max-height:100dvh; height:100vh; height:100dvh; border-radius:0; }

  .sv-toast{

    transform:translate(-50%,12px); opacity:0; pointer-events:none; z-index:80;
    background:var(--text-1); color:var(--body-bg); padding:9px 16px; border-radius:100px;
    font-size:13px; font-weight:600; max-width:calc(100vw - 32px); text-align:center;

  .thread-messages{

  /* ===== Order Details modal — copied from SV_APP app.html (#orderDetailsModal) ===== */
.odm-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 10000;
  opacity: 0; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
  transition: opacity 0.2s ease;
}
.odm-overlay.active { opacity: 1; pointer-events: auto; }

.odm-panel {
  background: #ffffff;
  border-radius: 20px;
  width: 100%; max-width: 400px;
  max-height: 88vh; overflow-y: auto;
  box-shadow: 0 24px 64px rgba(0,0,0,0.22);
  transform: scale(0.93);
  opacity: 0;
  transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), opacity 0.18s ease;
  display: flex; flex-direction: column;
}
html:not([data-theme="light"]) .odm-panel {
  background: #162130;
  box-shadow: 0 24px 64px rgba(0,0,0,0.55);
}
.odm-overlay.active .odm-panel {
  transform: scale(1);
  opacity: 1;
}

<script>
/* SuppVerse BD — responsive product image helper
 * New admin uploads are stored as <base>-1200.webp with sibling files
 * <base>-300.webp, -600.webp and -2000.webp. Any URL that does not match
 * that pattern (all legacy uploads) is returned untouched, so nothing breaks.
 *   300  cart, orders, trending, admin thumbs
 *   600  store grid
 *   1200 product detail gallery (the URL stored in product_web.web_images)
 *   2000 zoom viewer
 */
(function(){
  var RE = /-(?:300|600|1200|2000)\.(webp|jpg)((?:\?|#)[\s\S]*)?$/i;
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* svImg(url, 300) -> sized variant URL (or the same URL for legacy files) */
  window.svImg = function(u, w){
    if(typeof u !== 'string' || !u) return u;
    return u.replace(RE, function(_, ext, q){ return '-' + w + '.' + ext + (q || ''); });
  };

  /* onerror handler: fall back to the stored base URL once, then call onFail */
  window.svImgFb = function(el, onFail){
    var f = el.getAttribute('data-fb');
    if(f && el.getAttribute('src') !== f){ el.setAttribute('src', f); return true; }
    if(typeof onFail === 'function') onFail(el);
    return false;
  };

  /* svImgAttrs(url, 300[, 'failFnName']) -> ' src="..." data-fb="..." onerror="..."' for an <img> tag */
  window.svImgAttrs = function(u, w, failFn){
    var v = window.svImg(u, w), hasVariant = v !== u;
    return ' src="' + esc(v) + '"' +
      (hasVariant ? ' data-fb="' + esc(u) + '"' : '') +
      ((hasVariant || failFn) ? ' onerror="svImgFb(this' + (failFn ? ',' + failFn : '') + ')"' : '');
  };

  window.svImgGone = function(el){ if(el && el.remove) el.remove(); };
})();
</script>
<script>
/* Theme follows the main app (same origin): ?theme= from the overlay, else the app's saved theme, else dark */
(function(){
  var r=document.documentElement, t=null;
  try{ t=new URLSearchParams(location.search).get("theme"); }catch(e){}
  if(t!=="light"&&t!=="dark"){ try{ t=localStorage.getItem("svbd-theme"); }catch(e){} }
  r.setAttribute("data-theme", t==="light"?"light":"dark");
  try{ if(window.frameElement) r.classList.add("is-embedded"); }catch(e){ r.classList.add("is-embedded"); }
})();

        <div id="odmPayment"></div>
      </div>
    </div>
  </div>
</div>

        }
      }
      if(state.custTypeFilter !== "all"){
        const cust = c.customer_key ? MOCK_CUSTOMERS[c.customer_key] : null;
        const custStatus = cust ? cust.status : "guest";
        if(custStatus !== state.custTypeFilter) return false;
      }
      if(!q) return true;
      return (c.customer_name || "").toLowerCase().includes(q) ||
             (c.last_message || "").toLowerCase().includes(q);
    });
  }

  function updateCounts(){
    els.tabs.querySelectorAll(".count").forEach(el => {
      const key = el.dataset.count;
      const n = key === "all" ? state.conversations.length
        : state.conversations.filter(c => c.channel === key).length;
      el.textContent = n > 0 ? n : "";
    });
    els.statusTabs.querySelectorAll(".count").forEach(el => {
      const key = el.dataset.statusCount;
      let n;
      if(key === "all") n = state.conversations.length;
      else if(key === "unread") n = state.conversations.filter(c => (c.unread_count || 0) > 0).length;
      else if(key === "assigned") n = state.conversations.filter(c => !!c.assigned_to).length;
      else n = state.conversations.filter(c => (c.convo_status || "waiting") === key).length;
      el.textContent = n > 0 ? n : "";
    });

  function escAttr(str){ return escapeHtml(String(str)).replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }

  let toastTimer = null;
  function showToast(msg){
    let t = document.getElementById("svToast");
    if(!t){
      t = document.createElement("div");
      t.id = "svToast"; t.className = "sv-toast"; t.setAttribute("role", "status"); t.setAttribute("aria-live", "polite");
      document.body.appendChild(t);
    }
    t.textContent = msg;
    void t.offsetWidth;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  async function copyText(text){
    try{
      if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
    }catch(e){ /* fall through to legacy path */ }
    try{
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }catch(e){ return false; }
  }

  /* ---------- Order Details modal bridge (same modal as the main app's Orders tab) ---------- */
  function buildOdmOrder(cust, o){
    const total = Number(o.amount) || 0;
    const items = (o.lines && o.lines.length) ? o.lines
      : [{ name:o.items || "Items not recorded", category:"supplement", qty:1, price:total }];
    const subtotal = items.reduce((a, i) => a + i.qty * i.price, 0);
    const discount = Number(o.discount) || 0, shipping = Number(o.shipping) || 0;
    const ch = String((sheet.conv && sheet.conv.channel) || (cust.channels && cust.channels[0]) || "website").toLowerCase();
    const paid = String(o.payment_status).toLowerCase() === "paid";
    return {
      orderId:o.id, status:o.status, state:String(o.status).toLowerCase(), created_at:o.placed_at, status_at:o.placed_at,
      channel: ch === "messenger" ? "facebook" : ch,
      voucher_code:o.voucher_code || "",
      subtotal:subtotal, discount:discount, shipping:shipping, total:total,
      items:items,
      payment:{ method:o.payment_method || "", status:paid ? "Paid" : "Unpaid", txn:o.txn || "", sender:o.sender || "", amount_due:total },
      registered:cust.status === "registered", name:cust.name, customer_id:cust.customer_id, customer_since:cust.customer_since,
      phone:cust.phone, email:cust.email || "", address:cust.address || ""

  function statsHtml(cust){

  /* ---------- interactions (delegated) ---------- */
  function commitTag(){
    const inp = document.getElementById("csTagInput"); if(!inp) return;
    const v = inp.value.trim().replace(/\s+/g, " ");
    const loc = localFor();
    if(!v){ sheet.tagInput = false; refreshTags(); return; }
    if(loc.tags.some(t => t.toLowerCase() === v.toLowerCase())){ showToast("Tag already added"); inp.select(); return; }
    if(loc.tags.length >= TAG_MAX){ showToast("Tag limit reached (" + TAG_MAX + ")"); return; }
    loc.tags.push(v);
    sheet.tagInput = false;
    refreshTags();
    showToast("Tag added");
  }

  els.custSheet.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if(!el || !els.custSheet.contains(el)) return;
    const act = el.dataset.act;
    switch(act){
      case "close": closeCustomerPanel(); break;
      case "back": goView("profile"); break;
      case "open-order": openOrderModal(el.dataset.oid); break;
      case "all-orders": goView("orders"); break;
      case "no-phone": showToast("No phone number on file"); break;
      case "toggle-val": {
        const open = el.classList.toggle("is-open");
        el.setAttribute("aria-expanded", String(open));
        break;
      }
      case "expand": {
        sheet.full = !sheet.full;
        els.custSheet.classList.toggle("is-full", sheet.full);
        el.setAttribute("aria-pressed", String(sheet.full));
        el.innerHTML = (sheet.full ? ICONS.collapse : ICONS.expand) + "<span>" + (sheet.full ? "Collapse" : "Full profile") + "</span>";
        break;
      }
      case "copy": {
        const val = el.dataset.copy;
        if(!val){ showToast("Nothing to copy"); break; }
        copyText(val).then(ok => {
          if(ok){ flashCopied(el); showToast(el.dataset.what === "Customer ID" ? "Customer ID " + val + " copied" : (el.dataset.what || "Value") + " copied"); }
          else showToast("Couldn't copy — select and copy manually");
        });
        break;
      }
      case "tag-add": sheet.tagInput = true; refreshTags(true); break;
      case "tag-commit": commitTag(); break;
      case "tag-remove": {
        const loc = localFor(); const i = Number(el.dataset.i);
        const [gone] = loc.tags.splice(i, 1);
        refreshTags();
        const nxt = els.custSheetScroll.querySelector("#csTags .cs-chip button, #csTags .cs-chip--add");
        if(nxt) nxt.focus();
        showToast("Removed “" + gone + "”");
        break;
      }
      case "note-add": sheet.noteForm = true; refreshNotes(true); break;
      case "note-cancel": sheet.noteForm = false; refreshNotes(); {
        const b = els.custSheetScroll.querySelector('[data-act="note-add"]'); if(b) b.focus();
      } break;
      case "note-save": {
        const ta = document.getElementById("csNoteInput"); if(!ta) break;
        const text = ta.value.trim(); if(!text) break;
        localFor().notes.unshift({ text, at:new Date().toISOString() });
        sheet.noteForm = false; refreshNotes();
        const b = els.custSheetScroll.querySelector('[data-act="note-add"]'); if(b) b.focus();
        showToast("Private note saved");
        break;
      }
    }
  });

  els.custSheet.addEventListener("input", (e) => {
    if(e.target.id !== "csNoteInput") return;
    const n = e.target.value.length;
    document.getElementById("csNoteCount").textContent = n + "/" + NOTE_LEN;
    document.getElementById("csNoteSave").disabled = !e.target.value.trim();
  });

  els.custSheet.addEventListener("keydown", (e) => {
    if(e.target.id === "csTagInput"){
      if(e.key === "Enter"){ e.preventDefault(); e.stopPropagation(); commitTag(); return; }
      if(e.key === "Escape"){
        e.preventDefault(); e.stopPropagation();
        sheet.tagInput = false; refreshTags();
        const b = els.custSheetScroll.querySelector('[data-act="tag-add"]'); if(b) b.focus();
        return;
      }
    }
    if(e.key === "Tab"){
      const f = [...els.custSheet.querySelectorAll('a[href],button:not([disabled]),input,textarea,[tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null);
      if(!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if(e.shiftKey && (document.activeElement === first || document.activeElement === els.custSheet)){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });

  document.addEventListener("keydown", (e) => {
    if(e.key !== "Escape" || !els.custSheet.classList.contains("open") || e.defaultPrevented) return;
    if(sheet.noteForm){ sheet.noteForm = false; refreshNotes(); return; }
    if(sheet.view !== "profile"){ goView("profile"); return; }
    closeCustomerPanel();
  });

  function formatOrderDate(iso){
    return new Date(iso).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
  }

  async function loadMessages(conv){
    els.threadMessages.innerHTML = "";
    let messages = [];

    if(supabase){
      const { data, error } = await supabase
        .from("messages")
        .select("id, conversation_id, sender_type, content, created_at, channel")
        .eq("conversation_id", conv.id)
        .order("created_at", { ascending:true });
      if(error){
        console.error("loadMessages error:", error);
      }else{
        messages = data || [];
      }
      subscribeMessagesRealtime(conv.id);
    }else{
      messages = MOCK_MESSAGES[conv.id] || [];
    }

    renderMessages(messages);
  }

  function subscribeMessagesRealtime(conversationId){
    if(messagesRealtimeChannel){
      supabase.removeChannel(messagesRealtimeChannel);
    }
    messagesRealtimeChannel = supabase
      .channel("messages-" + conversationId)
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:`conversation_id=eq.${conversationId}` }, (payload) => {
        appendMessage(payload.new);
      })
      .subscribe();
  }

  function formatDayLabel(iso){
    const d = new Date(iso);
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    if(d.toDateString() === today.toDateString()) return "Today";
    if(d.toDateString() === yesterday.toDateString()) return "Yesterday";
    return d.toLocaleDateString(undefined, { month:"short", day:"numeric", year: d.getFullYear() !== today.getFullYear() ? "numeric" : undefined });
  }

  function buildDayDivider(iso){
    const el = document.createElement("div");
    el.className = "day-divider";
    el.textContent = formatDayLabel(iso);
    return el;
  }

    const card = document.createElement("div");
    card.className = "note-card";
    const time = new Date(m.created_at).toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit", hour12:true });
    const author = m.author_name || "You";
    card.innerHTML = `
      <div class="note-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
      <div class="note-card__body">
        <div class="note-card__label">Internal Note</div>
        <div class="note-card__text"></div>
        <div class="note-card__meta">${author} · ${time}</div>
      </div>`;
    card.querySelector(".note-card__text").textContent = m.content;
    row.appendChild(card);
    return row;
  }

  function buildMessageRow(m, tight){
    if(m.sender_type === "note" || m.is_internal === true){
      return buildNoteRow(m);
    }
    const row = document.createElement("div");
    row.className = `msg-row from-${m.sender_type}` + (tight ? " tight" : "");
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble";
    const text = document.createElement("div");
    text.className = "msg-bubble__text";
    text.textContent = m.content;
    const time = document.createElement("div");
    time.className = "msg-bubble__time";
    time.textContent = new Date(m.created_at).toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit", hour12:true });
    bubble.appendChild(text);
    bubble.appendChild(time);
    row.appendChild(bubble);
    return row;
  }

  function renderMessages(messages){
    els.threadMessages.innerHTML = "";
    let lastDateStr = null;
    let lastSender = null;
    messages.forEach(m => {
      const dateStr = new Date(m.created_at).toDateString();
      if(dateStr !== lastDateStr){
        els.threadMessages.appendChild(buildDayDivider(m.created_at));
        lastDateStr = dateStr;
        lastSender = null;
      }
      els.threadMessages.appendChild(buildMessageRow(m, m.sender_type === lastSender));
      lastSender = m.sender_type;
    });
    els.threadMessages.scrollTop = els.threadMessages.scrollHeight;
  }

  function appendMessage(m, opts){
    opts = opts || {};
    const dividers = els.threadMessages.querySelectorAll(".day-divider");
    const lastDivider = dividers[dividers.length - 1];
    const label = formatDayLabel(m.created_at);
    if(!lastDivider || lastDivider.textContent !== label){
      els.threadMessages.appendChild(buildDayDivider(m.created_at));
    }
    els.threadMessages.appendChild(buildMessageRow(m, false));
    els.threadMessages.scrollTop = els.threadMessages.scrollHeight;

    if(opts.skipLastMessage) return;
    const conv = state.conversations.find(c => c.id === m.conversation_id);
    if(conv){
      conv.last_message = m.content;
      conv.updated_at = m.created_at;
    }
  }

  function updateSendState(){
    els.sendBtn.disabled = els.composerInput.value.trim().length === 0;
  }

  function autoResizeComposer(){
    els.composerInput.style.height = "auto";
    els.composerInput.style.height = Math.min(els.composerInput.scrollHeight, 110) + "px";
  }

  els.composerInput.addEventListener("input", () => {
    updateSendState();
    autoResizeComposer();
  });

  els.composerInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      els.composerForm.requestSubmit();
    }
  });

  els.composerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const content = els.composerInput.value.trim();
    if(!content || !state.activeConversationId) return;

    const conv = state.conversations.find(c => c.id === state.activeConversationId);

    if(state.noteMode){
      const note = {
        conversation_id: state.activeConversationId,
        sender_type: "note",
        is_internal: true,
        channel: null,
        content,
        created_at: new Date().toISOString(),
        author_name: "You"
      };
      appendMessage(note, { skipLastMessage:true });
      els.composerInput.value = "";
      autoResizeComposer();
      updateSendState();
      if(supabase){
        const { error } = await supabase.from("messages").insert(note);
        if(error) console.error("sendNote error:", error);
      }else if(conv){
        MOCK_MESSAGES[conv.id] = MOCK_MESSAGES[conv.id] || [];
        MOCK_MESSAGES[conv.id].push(note);
      }
      return;
    }

    const message = {
      conversation_id: state.activeConversationId,
      sender_type: "admin",
      is_internal: false,
      content,
      created_at: new Date().toISOString(),
      channel: conv ? conv.channel : null
    };

    appendMessage(message);
    els.composerInput.value = "";
    autoResizeComposer();
    updateSendState();

    if(supabase){
      const { error } = await supabase.from("messages").insert(message);
      if(error) console.error("sendMessage error:", error);
      if(conv){
        await supabase.from("conversations").update({ last_message: content, updated_at: message.created_at }).eq("id", conv.id);
      }
    }else if(conv){
      MOCK_MESSAGES[conv.id] = MOCK_MESSAGES[conv.id] || [];
      MOCK_MESSAGES[conv.id].push(message);
    }
  });

  document.getElementById("threadBackBtn").addEventListener("click", backToList);

  document.getElementById("attachBtn").addEventListener("click", () => {
    console.log("Attach tapped");
  });

  els.noteToggleBtn.addEventListener("click", () => {
    state.noteMode = !state.noteMode;
    els.noteToggleBtn.classList.toggle("active", state.noteMode);
    els.noteToggleBtn.setAttribute("aria-pressed", String(state.noteMode));
    els.composerForm.classList.toggle("note-mode", state.noteMode);
    els.composerInput.placeholder = state.noteMode ? "Add an internal note..." : `Message via ${(CHANNEL_META[state.activeChannel] && CHANNEL_META[state.activeChannel].label) || "chat"}...`;
    els.composerInput.focus();
  });

  document.getElementById("threadMoreBtn").addEventListener("click", () => {
    console.log("Thread options tapped");
  });

  document.getElementById("newMessageMenuItem").addEventListener("click", () => {
    console.log("New message tapped");
    closeFabMenu();
  });

  document.getElementById("viewCustomersMenuItem").addEventListener("click", () => {
    closeFabMenu();
    openCustomersView();
  });

  /* ---------- FAB menu (customer type filter) ---------- */
  const fabMenu = document.getElementById("fabMenu");
  const fabMenuBackdrop = document.getElementById("fabMenuBackdrop");
  const fabMainBtn = document.getElementById("fabMainBtn");
  const fabFilterDot = document.getElementById("fabFilterDot");

  function openFabMenu(){
    fabMenu.classList.add("open");
    fabMenuBackdrop.classList.add("open");
    fabMainBtn.classList.add("open");
  }
  function closeFabMenu(){
    fabMenu.classList.remove("open");
    fabMenuBackdrop.classList.remove("open");
    fabMainBtn.classList.remove("open");
  }
  fabMainBtn.addEventListener("click", () => {
    fabMenu.classList.contains("open") ? closeFabMenu() : openFabMenu();
  });
  fabMenuBackdrop.addEventListener("click", closeFabMenu);

  fabMenu.querySelectorAll("[data-cust-filter]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.custTypeFilter = btn.dataset.custFilter;
      fabMenu.querySelectorAll("[data-cust-filter]").forEach(b =>
        b.setAttribute("aria-pressed", b === btn ? "true" : "false")
      );
      fabFilterDot.classList.toggle("show", state.custTypeFilter !== "all");
      closeFabMenu();
      render();
    });
  });

  document.querySelectorAll(".nav-item").forEach(btn => {
    btn.addEventListener("click", () => {
      if(btn.dataset.nav === "customers"){
        console.log("Opening Customers view...");
        openCustomersView();
        return;
      }
      if(btn.dataset.nav === "orders"){
        console.log("Opening Orders view...");
        openOrdersView();
        return;
      }
      if(btn.dataset.nav === "home" && window.parent !== window){
        window.parent.postMessage({ type:"sv-close-inbox" }, "*");
        return;
      }
      console.log("Navigate to:", btn.dataset.nav);
    });
  });

  /* ---------- Customers screen (all registered customers) ---------- */
  function openCustomersView(){
    try{
      renderCustomersList();
    }catch(err){
      console.error("renderCustomersList failed:", err);
      els.customersListScroll.innerHTML = `<div class="cust-list-empty">Couldn't load customers (${escapeHtml(err.message || "unknown error")}). Check console.</div>`;
    }
    els.customersView.hidden = false;
    window.scrollTo(0, 0);
    if(els.customersListScroll) els.customersListScroll.scrollTop = 0;
  }
  function closeCustomersView(){
    els.customersView.hidden = true;
  }
  document.getElementById("customersBackBtn").addEventListener("click", closeCustomersView);

  function findConversationForCustomerKey(key){
    const matches = state.conversations.filter(c => c.customer_key === key);
    if(!matches.length) return null;
    return matches.sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at))[0];
  }

  function renderCustomersList(){
    const registered = Object.entries(MOCK_CUSTOMERS)
      .filter(([, cust]) => cust.status === "registered")
      .map(([key, cust]) => ({ key, ...cust }))
      .sort((a, b) => a.name.localeCompare(b.name));

    els.customersCount.textContent = registered.length
      ? `${registered.length} customer${registered.length === 1 ? "" : "s"}`
      : "";

    if(!registered.length){
      els.customersListScroll.innerHTML = `<div class="cust-list-empty">No registered customers have messaged in yet.</div>`;
      return;
    }

    els.customersListScroll.innerHTML = registered.map(cust => {
      const platformsHtml = cust.channels.map(ch =>
        `<span class="${CHANNEL_ICON_CLASS[ch]}">${channelBadgeSvg(ch)}</span>`
      ).join("");
      return `
        <div class="cust-list-row" data-cust-key="${cust.key}" role="button" tabindex="0">
          <div class="cust-list-row__avatar" style="background:${hashColor(cust.name)}">${initials(cust.name)}</div>
          <div class="cust-list-row__main">
            <div class="cust-list-row__name">${escapeHtml(cust.name)}<svg viewBox="0 0 24 24" fill="none"><path fill="currentColor" d="m21.5609 10.7386-1.36-1.58001c-.26-.3-.47-.86-.47-1.26v-1.7c0-1.06-.87-1.93-1.93-1.93h-1.7c-.39 0-.96-.21-1.26-.47l-1.58-1.36c-.69-.59-1.82-.59-2.52 0l-1.57004 1.37c-.3.25-.87.46-1.26.46h-1.73c-1.06 0-1.93.87-1.93 1.93v1.71c0 .39-.21.95-.46 1.25l-1.35 1.59001c-.58.69-.58 1.81 0 2.5l1.35 1.59c.25.3.46.86.46 1.25v1.71c0 1.06.87 1.93 1.93 1.93h1.73c.39 0 .96.21 1.26.47l1.58004 1.36c.69.59 1.82.59 2.52 0l1.58-1.36c.3-.26.86-.47 1.26-.47h1.7c1.06 0 1.93-.87 1.93-1.93v-1.7c0-.39.21-.96.47-1.26l1.36-1.58c.58-.69.58-1.83-.01-2.52m-5.4-.63-4.83 4.83c-.14.14-.33.22-.53.22s-.39-.08-.53-.22l-2.42004-2.42c-.29-.29-.29-.77 0-1.06s.77-.29 1.06 0l1.89004 1.89 4.3-4.30001c.29-.29.77-.29 1.06 0s.29.77 0 1.06001"/></svg></div>
            <span class="cust-list-row__id">${escapeHtml(cust.customer_id)}</span>
          </div>
          <div class="cust-list-row__platforms">${platformsHtml}</div>
        </div>
      `;
    }).join("");

    els.customersListScroll.querySelectorAll("[data-cust-key]").forEach(row => {
      row.addEventListener("click", () => {
        const conv = findConversationForCustomerKey(row.dataset.custKey);
        closeCustomersView();
        if(conv) openConversation(conv.id);
      });
    });
  }

  /* ---------- Orders screen (every order, tagged with its customer) ---------- */
  function openCustomerPanelByKey(key){
    const cust = MOCK_CUSTOMERS[key];
    if(!cust) return;
    openCustomerPanel({ customer_key:key, customer_name:cust.name, channel:null });
  }

  function openOrdersView(){
    try{
      renderOrdersList();
    }catch(err){
      console.error("renderOrdersList failed:", err);
      els.ordersListScroll.innerHTML = `<div class="cust-list-empty">Couldn't load orders (${escapeHtml(err.message || "unknown error")}). Check console.</div>`;
    }
    els.ordersView.hidden = false;
    window.scrollTo(0, 0);
    if(els.ordersListScroll) els.ordersListScroll.scrollTop = 0;
  }
  function closeOrdersView(){
    els.ordersView.hidden = true;
  }
  document.getElementById("ordersBackBtn").addEventListener("click", closeOrdersView);

  function renderOrdersList(){
    const allOrders = [];
    Object.entries(MOCK_CUSTOMERS).forEach(([key, cust]) => {
      const orders = [...(cust.current_order ? [cust.current_order] : []), ...(cust.past_orders || [])];
      orders.forEach(o => allOrders.push({ ...o, custKey:key, custName:cust.name, custId:cust.customer_id }));
    });
    allOrders.sort((a, b) => new Date(b.placed_at) - new Date(a.placed_at));

    els.ordersCount.textContent = allOrders.length
      ? `${allOrders.length} order${allOrders.length === 1 ? "" : "s"}`
      : "";

    if(!allOrders.length){
      els.ordersListScroll.innerHTML = `<div class="cust-list-empty">No orders yet.</div>`;
      return;
    }

    els.ordersListScroll.innerHTML = allOrders.map((o, i) => `
      <div class="order-list-card" data-cust-key="${o.custKey}" role="button" tabindex="0">
        <div class="order-card__top">
          ${idBadgeHtml(o.id)}
          <span class="order-status-tag ${o.status.toLowerCase()}">${escapeHtml(o.status)}</span>
        </div>
        ${o.items ? `<div class="order-card__items">${escapeHtml(o.items)}</div>` : ""}
        <div class="order-card__meta">
          <span>${formatOrderDate(o.placed_at)}</span>
          <span class="order-card__amount">৳${o.amount.toLocaleString()}</span>
        </div>
        <div class="order-list-card__customer">
          <div class="order-list-card__avatar" style="background:${hashColor(o.custName)}">${initials(o.custName)}</div>
          <div class="order-list-card__customer-info">
            <div class="order-list-card__customer-name">${escapeHtml(o.custName)}</div>
            <div class="order-list-card__customer-id">${escapeHtml(o.custId || "—")}</div>
          </div>
          <svg class="order-list-card__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>
    `).join("");

    els.ordersListScroll.querySelectorAll("[data-cust-key]").forEach(card => {
      card.addEventListener("click", () => {
        closeOrdersView();
        openCustomerPanelByKey(card.dataset.custKey);
      });
    });
  }

  /* ---------- Back to main app ---------- */
  document.getElementById("inboxBackBtn").addEventListener("click", () => {
    try{ window.parent.postMessage({ type:"sv-close-inbox" }, "*"); }catch(e){}
  });


  /* Theme sync from the main app when embedded */
  window.addEventListener("message", (e) => {
    if(e.data && e.data.type === "sv-theme"){
      document.documentElement.setAttribute("data-theme", e.data.dark ? "dark" : "light");
    }
  });

  /* ---------- Boot ---------- */
  initSupabase();
})();
</script>

</body>
</html>
