<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unified Inbox · SuppVerse BD</title>
<style>
  :root{
    --body-bg:#0f1621;
    --surface:#162130;
    --surface-2:#1d2c3e;
    --hairline:rgba(255,255,255,0.07);
    --text-1:#eaf2f8;
    --text-2:#9fb0c3;
    --text-3:#657386;
    --cyan:#009ddc;
    --purple:#6761a8;
    --green:#009b72;
    --orange:#f26430;

    --fb:#1877F2;
    --ig-a:#F58529;
    --ig-b:#DD2A7B;
    --ig-c:#8134AF;
    --wa:#25D366;

    --font-head:'Plus Jakarta Sans', system-ui, sans-serif;
    --font-body:'DM Sans', system-ui, sans-serif;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; background:var(--body-bg); }
  body{
    font-family:var(--font-body);
    color:var(--text-1);
    display:flex;
    justify-content:center;
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ transition:none !important; animation:none !important; }
  }

  a,button{ font-family:inherit; }
  button{ background:none; border:none; color:inherit; cursor:pointer; padding:0; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--cyan);
    outline-offset:2px;
    border-radius:6px;
  }

  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--body-bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Header ---------- */
  .inbox-header{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--body-bg);
    padding:18px 16px 0;
    border-bottom:1px solid var(--hairline);
  }
  .inbox-header__top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .inbox-header__title{
    font-family:var(--font-head);
    font-weight:700;
    font-size:22px;
    letter-spacing:-0.01em;
    margin:0;
  }
  .bell-btn{
    position:relative;
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    color:var(--text-2);
  }
  .bell-btn:hover{ background:var(--surface); color:var(--text-1); }
  .bell-btn svg{ width:20px; height:20px; }
  .bell-dot{
    position:absolute;
    top:8px;
    right:9px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--orange);
    border:2px solid var(--body-bg);
  }

  .search-wrap{
    position:relative;
    margin-bottom:14px;
  }
  .search-wrap svg{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    color:var(--text-3);
    pointer-events:none;
  }
  #searchInput{
    width:100%;
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:11px;
    padding:11px 14px 11px 38px;
    font-size:14.5px;
    color:var(--text-1);
    font-family:var(--font-body);
  }
  #searchInput::placeholder{ color:var(--text-3); }

  /* ---------- Filter tabs (underline, messaging-app style) ---------- */
  .filter-tabs{
    display:flex;
    gap:22px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:0;
  }
  .filter-tabs::-webkit-scrollbar{ display:none; }
  .filter-tab{
    flex:0 0 auto;
    font-size:13.5px;
    font-weight:600;
    color:var(--text-3);
    padding:0 2px 12px;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .filter-tab[aria-selected="true"]{
    color:var(--text-1);
    border-bottom-color:var(--cyan);
  }
  .filter-tab .count{
    color:var(--text-3);
    font-weight:500;
    margin-left:4px;
  }
  .filter-tab[aria-selected="true"] .count{ color:var(--cyan); }

  /* ---------- Conversation list ---------- */
  .conv-list{
    flex:1;
    overflow-y:auto;
    padding-bottom:140px; /* clears bottom nav + FAB */
  }
  .conv-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 16px;
    border-bottom:1px solid var(--hairline);
    width:100%;
    text-align:left;
  }
  .conv-row:hover{ background:var(--surface); }
  .conv-row.is-unread{ background:rgba(0,157,220,0.05); }

  .unread-dot{
    flex:0 0 auto;
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--cyan);
    opacity:0;
  }
  .conv-row.is-unread .unread-dot{ opacity:1; }

  .avatar-wrap{
    position:relative;
    flex:0 0 auto;
    width:46px;
    height:46px;
  }
  .avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    background:var(--surface-2);
  }
  .avatar-initials{
    width:46px;
    height:46px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-head);
    font-weight:700;
    font-size:15px;
    color:#fff;
  }
  .channel-badge{
    position:absolute;
    bottom:-2px;
    right:-2px;
    width:18px;
    height:18px;
    border-radius:50%;
    border:2.5px solid var(--body-bg);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .channel-badge svg{ width:9px; height:9px; }
  .channel-badge.messenger{ background:var(--fb); }
  .channel-badge.whatsapp{ background:var(--wa); }
  .channel-badge.instagram{
    background:linear-gradient(135deg, var(--ig-a), var(--ig-b) 55%, var(--ig-c));
  }

  .conv-main{
    flex:1;
    min-width:0;
  }
  .conv-main__top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
  }
  .conv-name{
    font-family:var(--font-head);
    font-size:14.5px;
    font-weight:600;
    color:var(--text-2);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .is-unread .conv-name{ color:var(--text-1); font-weight:700; }
  .conv-time{
    flex:0 0 auto;
    font-size:11.5px;
    color:var(--text-3);
  }
  .is-unread .conv-time{ color:var(--cyan); font-weight:600; }
  .conv-snippet{
    margin-top:2px;
    font-size:13px;
    color:var(--text-3);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .is-unread .conv-snippet{ color:var(--text-2); font-weight:500; }

  .empty-state{
    padding:70px 32px 0;
    text-align:center;
    color:var(--text-3);
  }
  .empty-state svg{ width:34px; height:34px; margin-bottom:14px; color:var(--text-3); }
  .empty-state p{ margin:0; font-size:13.5px; line-height:1.5; }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;
    max-width:448px;
    width:calc(100% - 32px);
    margin:0 auto;
    left:0; right:0;
    bottom:78px;
    display:flex;
    justify-content:flex-end;
    pointer-events:none;
    z-index:25;
  }
  .fab button{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--cyan);
    color:#fff;
    font-weight:600;
    font-size:13.5px;
    padding:13px 18px;
    border-radius:100px;
    box-shadow:0 8px 20px rgba(0,157,220,0.35);
    transition:transform 0.15s ease;
  }
  .fab button:active{ transform:scale(0.96); }
  .fab svg{ width:16px; height:16px; }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed;
    bottom:0;
    left:0; right:0;
    max-width:480px;
    margin:0 auto;
    background:var(--surface);
    border-top:1px solid var(--hairline);
    display:flex;
    padding:9px 4px calc(9px + env(safe-area-inset-bottom));
    z-index:20;
  }
  .nav-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color:var(--text-3);
    padding:4px 0;
  }
  .nav-item svg{ width:21px; height:21px; }
  .nav-item span{ font-size:10px; font-weight:600; }
  .nav-item[aria-current="page"]{ color:var(--cyan); }

  @media (max-width:340px){
    .filter-tabs{ gap:16px; }
  }

  /* ---------- Thread / chat view ---------- */
  #threadView:not([hidden]){
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  .thread-header{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 12px;
    background:var(--body-bg);
    border-bottom:1px solid var(--hairline);
  }
  .thread-back, .thread-more{
    flex:0 0 auto;
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    color:var(--text-2);
  }
  .thread-back:hover, .thread-more:hover{ background:var(--surface); color:var(--text-1); }
  .thread-back svg{ width:19px; height:19px; }
  .thread-more svg{ width:17px; height:17px; }

  .thread-avatar-wrap{
    position:relative;
    flex:0 0 auto;
    width:38px;
    height:38px;
  }
  .thread-avatar-wrap .avatar,
  .thread-avatar-wrap .avatar-initials{
    width:38px;
    height:38px;
    font-size:13px;
  }
  .thread-avatar-wrap .channel-badge{
    width:15px;
    height:15px;
    border-width:2px;
  }
  .thread-avatar-wrap .channel-badge svg{ width:7.5px; height:7.5px; }

  .thread-identity{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  .thread-name{
    font-family:var(--font-head);
    font-weight:700;
    font-size:15px;
    color:var(--text-1);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .thread-channel{
    font-size:11.5px;
    font-weight:600;
    margin-top:1px;
  }
  .thread-channel.messenger{ color:var(--fb); }
  .thread-channel.whatsapp{ color:var(--wa); }
  .thread-channel.instagram{
    background:linear-gradient(90deg, var(--ig-a), var(--ig-b), var(--ig-c));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .thread-messages{
    flex:1;
    overflow-y:auto;
    padding:16px 14px;
    display:flex;
    flex-direction:column;
  }
  .day-divider{
    align-self:center;
    font-size:11.5px;
    font-weight:600;
    color:var(--text-3);
    background:var(--surface);
    padding:4px 12px;
    border-radius:100px;
    margin:6px 0 12px;
  }
  .msg-row{
    display:flex;
    max-width:78%;
    margin-top:10px;
  }
  .msg-row.tight{ margin-top:3px; }
  .msg-row.from-customer{ align-self:flex-start; }
  .msg-row.from-admin{ align-self:flex-end; flex-direction:row-reverse; }
  .msg-bubble{ display:flex; flex-direction:column; }
  .msg-bubble__text{
    padding:9px 13px;
    font-size:14px;
    line-height:1.4;
    border-radius:16px;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .from-customer .msg-bubble__text{
    background:var(--surface-2);
    color:var(--text-1);
    border-bottom-left-radius:4px;
  }
  .from-admin .msg-bubble__text{
    background:var(--cyan);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .msg-bubble__time{
    font-size:10.5px;
    color:var(--text-3);
    margin-top:3px;
    padding:0 3px;
  }
  .from-admin .msg-bubble__time{ text-align:right; }

  .thread-composer{
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--hairline);
    background:var(--body-bg);
  }
  .composer-attach{
    flex:0 0 auto;
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    color:var(--text-2);
  }
  .composer-attach:hover{ background:var(--surface); color:var(--text-1); }
  .composer-attach svg{ width:19px; height:19px; }

  #composerInput{
    flex:1;
    resize:none;
    max-height:110px;
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:18px;
    padding:9px 14px;
    font-family:var(--font-body);
    font-size:14px;
    color:var(--text-1);
    line-height:1.4;
  }
  #composerInput::placeholder{ color:var(--text-3); }

  .composer-send{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:50%;
    background:var(--cyan);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity 0.15s ease, transform 0.15s ease;
  }
  .composer-send:disabled{ opacity:0.4; }
  .composer-send:not(:disabled):active{ transform:scale(0.92); }
  .composer-send svg{ width:16px; height:16px; margin-left:-1px; }
</style>
</head>
<body>

<div class="app">

<div id="listView">

  <!-- Header -->
  <header class="inbox-header">
    <div class="inbox-header__top">
      <h1 class="inbox-header__title">Unified Inbox</h1>
      <button class="bell-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="bell-dot"></span>
      </button>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Search conversations..." autocomplete="off">
    </div>

    <div class="filter-tabs" id="filterTabs" role="tablist" aria-label="Filter by channel">
      <button class="filter-tab" role="tab" data-channel="all" aria-selected="true">All Channels <span class="count" data-count="all"></span></button>
      <button class="filter-tab" role="tab" data-channel="messenger" aria-selected="false">Messenger <span class="count" data-count="messenger"></span></button>
      <button class="filter-tab" role="tab" data-channel="instagram" aria-selected="false">Instagram <span class="count" data-count="instagram"></span></button>
      <button class="filter-tab" role="tab" data-channel="whatsapp" aria-selected="false">WhatsApp <span class="count" data-count="whatsapp"></span></button>
    </div>
  </header>

  <!-- Conversation list -->
  <main class="conv-list" id="convList" aria-live="polite"></main>

  <!-- FAB -->
  <div class="fab">
    <button id="newMessageBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New Message
    </button>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav" aria-label="Admin sections">
    <button class="nav-item" data-nav="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" data-nav="inbox" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11a2 2 0 0 1-2 2H9l-5 4V5Z"/></svg>
      <span>Inbox</span>
    </button>
    <button class="nav-item" data-nav="orders">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l-1.5 12.5a1 1 0 0 1-1 .5H6.5a1 1 0 0 1-1-.5L4 7Z"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/></svg>
      <span>Orders</span>
    </button>
    <button class="nav-item" data-nav="customers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><path d="M16 8.2a3 3 0 1 1 3.2 3M17.5 13.6c2.4.5 4 2.6 4 6.4"/></svg>
      <span>Customers</span>
    </button>
    <button class="nav-item" data-nav="analytics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>
      <span>Analytics</span>
    </button>
  </nav>

</div><!-- /listView -->

<div id="threadView" hidden>

  <header class="thread-header">
    <button class="thread-back" id="threadBackBtn" aria-label="Back to inbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="thread-avatar-wrap" id="threadAvatarWrap"></span>
    <span class="thread-identity">
      <span class="thread-name" id="threadName"></span>
      <span class="thread-channel" id="threadChannel"></span>
    </span>
    <button class="thread-more" id="threadMoreBtn" aria-label="More options">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </header>

  <main class="thread-messages" id="threadMessages" aria-live="polite"></main>

  <form class="thread-composer" id="composerForm">
    <button type="button" class="composer-attach" id="attachBtn" aria-label="Attach file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5 12.5 21a5 5 0 0 1-7-7L14 5.5a3.5 3.5 0 0 1 5 5L10.5 19a2 2 0 0 1-3-3L15 8.5"/></svg>
    </button>
    <textarea id="composerInput" rows="1" placeholder="Message..."></textarea>
    <button type="submit" class="composer-send" id="sendBtn" aria-label="Send message" disabled>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
    </button>
  </form>

</div><!-- /threadView -->

</div>

<script>
(() => {
  "use strict";

  /* =========================================================

  const MOCK_MESSAGES = {

      { sender_type:"customer", content:"Chocolate, the 2kg pack", created_at:new Date(Date.now()-10*60000).toISOString() },
      { sender_type:"customer", content:"Is the whey protein back in stock?", created_at:new Date(Date.now()-2*60000).toISOString() }
    ],
    m2: [
      { sender_type:"customer", content:"Hello, I placed an order last week", created_at:new Date(Date.now()-3*3600000).toISOString() },
      { sender_type:"admin", content:"Hi Tanvir, could you share your order ID?", created_at:new Date(Date.now()-2*3600000).toISOString() },
      { sender_type:"customer", content:"It's SV-2214", created_at:new Date(Date.now()-70*60000).toISOString() },
      { sender_type:"customer", content:"Order #SV-2214 hasn't arrived yet", created_at:new Date(Date.now()-58*60000).toISOString() }
    ],
    m3: [
      { sender_type:"customer", content:"Hi! Love your products", created_at:new Date(Date.now()-1*86400000).toISOString() },
      { sender_type:"admin", content:"Thank you so much! 🙏", created_at:new Date(Date.now()-1*86400000+8*60000).toISOString() },
      { sender_type:"customer", content:"Can I get a discount on bulk order?", created_at:new Date(Date.now()-3*3600000).toISOString() }
    ],
    m4: [
      { sender_type:"customer", content:"Package arrived today!", created_at:new Date(Date.now()-27*3600000).toISOString() },
      { sender_type:"customer", content:"Thanks, received it in good condition!", created_at:new Date(Date.now()-26*3600000).toISOString() },
      { sender_type:"admin", content:"So glad to hear that! Thanks for shopping with us 💚", created_at:new Date(Date.now()-25*3600000).toISOString() }
    ],
    m5: [
      { sender_type:"customer", content:"Hi, do you deliver outside Dhaka?", created_at:new Date(Date.now()-4*86400000).toISOString() },
      { sender_type:"admin", content:"Yes we do! Which city are you in?", created_at:new Date(Date.now()-3*86400000-3600000).toISOString() },
      { sender_type:"customer", content:"Chattogram", created_at:new Date(Date.now()-3*86400000-1800000).toISOString() },
      { sender_type:"customer", content:"Do you ship to Chattogram?", created_at:new Date(Date.now()-3*86400000).toISOString() }
    ]
  };

  /* ---------- Supabase data layer ---------- */
  async function initSupabase(){
    if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
      state.conversations = MOCK_CONVERSATIONS;
      render();
      return;
    }
    try{
      const mod = await import("https://esm.sh/@supabase/supabase-js@2");
      supabase = mod.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      await fetchConversations();
      subscribeRealtime();
    }catch(err){
      console.error("Supabase init failed, falling back to mock data:", err);
      state.conversations = MOCK_CONVERSATIONS;
      render();
    }
  }

  async function fetchConversations(){
    const { data, error } = await supabase
      .from("conversations")
      .select("id, customer_name, customer_avatar, channel, last_message, updated_at, unread_count")
      .order("updated_at", { ascending:false });

    if(error){
      console.error("fetchConversations error:", error);
      return;
    }
    state.conversations = data || [];
    render();
  }

  function subscribeRealtime(){
    realtimeChannel = supabase
      .channel("conversations-changes")
      .on("postgres_changes", { event:"*", schema:"public", table:"conversations" }, () => {
        fetchConversations();
      })
      .subscribe();
  }

  /* ---------- Helpers ---------- */
  function formatRelativeTime(iso){
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if(mins < 1) return "Just now";
    if(mins < 60) return mins + "m ago";
    const hrs = Math.floor(mins / 60);
    if(hrs < 24) return hrs + "h ago";
    const days = Math.floor(hrs / 24);
    if(days < 7) return days + "d ago";
    return new Date(iso).toLocaleDateString(undefined, { month:"short", day:"numeric" });
  }

  function initials(name){
    return (name || "?").trim().split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase();
  }

  function hashColor(name){
    let hash = 0;
    for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_PALETTE[Math.abs(hash) % AVATAR_PALETTE.length];
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function channelBadgeSvg(channel){
    if(channel === "messenger"){
      return '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.5 2 2 6.1 2 11.3c0 2.9 1.4 5.5 3.7 7.2V22l3.4-1.9c.9.25 1.9.4 2.9.4 5.5 0 10-4.1 10-9.2S17.5 2 12 2zm1 12.4-2.6-2.7-5 2.7 5.5-5.8 2.6 2.7 5-2.7-5.5 5.8z"/></svg>';
    }
    if(channel === "instagram"){
      return '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="17.2" cy="6.8" r="1"/></svg>';
    }
    return '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.6 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.2-.7-2.7-1.1-4.4-3.8-4.6-4-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 1-2.2.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5.2.6.7 1.9.8 2 .1.2.1.4 0 .6-.1.2-.2.3-.3.5-.2.2-.3.3-.1.6.2.3.9 1.5 1.9 2.4 1.3 1.2 2.4 1.5 2.7 1.7.3.1.5.1.6-.1.2-.2.7-.8.9-1.1.2-.3.4-.2.6-.1.2.1 1.5.7 1.8.8.3.1.5.2.5.3.1.3.1.7-.1 1.2z"/></svg>';
  }

  /* ---------- Render ---------- */
  function getFiltered(){
    const q = state.searchQuery.trim().toLowerCase();
    return state.conversations.filter(c => {
      const matchesChannel = state.activeFilter === "all" || c.channel === state.activeFilter;
      if(!matchesChannel) return false;
      if(!q) return true;
      return (c.customer_name || "").toLowerCase().includes(q) ||
             (c.last_message || "").toLowerCase().includes(q);
    });
  }

  function updateCounts(){
    els.tabs.querySelectorAll(".count").forEach(el => {
      const key = el.dataset.count;
      const n = key === "all" ? state.conversations.length
        : state.conversations.filter(c => c.channel === key).length;
      el.textContent = n > 0 ? n : "";
    });
  }

  function render(){
    updateCounts();
    const items = getFiltered().sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));

    if(items.length === 0){
      els.list.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h16v11a2 2 0 0 1-2 2H9l-5 4V5Z"/></svg>
          <p>${state.searchQuery ? "No conversations match your search." : "No conversations in this channel yet."}</p>
        </div>`;
      return;
    }

    els.list.innerHTML = items.map(c => {
      const unread = (c.unread_count || 0) > 0;
      const avatarHtml = c.customer_avatar
        ? `<img class="avatar" src="${escapeHtml(c.customer_avatar)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'avatar-initials',style:'background:${hashColor(c.customer_name||'?')}',textContent:'${initials(c.customer_name)}'}))">`
        : `<div class="avatar-initials" style="background:${hashColor(c.customer_name || "?")}">${initials(c.customer_name)}</div>`;

      return `
        <button class="conv-row ${unread ? "is-unread" : ""}" data-id="${escapeHtml(c.id)}">
          <span class="unread-dot"></span>
          <span class="avatar-wrap">
            ${avatarHtml}
            <span class="channel-badge ${c.channel}">${channelBadgeSvg(c.channel)}</span>
          </span>
          <span class="conv-main">
            <span class="conv-main__top">
              <span class="conv-name">${escapeHtml(c.customer_name || "Unknown")}</span>
              <span class="conv-time">${formatRelativeTime(c.updated_at)}</span>
            </span>
            <span class="conv-snippet">${escapeHtml(c.last_message || "")}</span>
          </span>
        </button>`;
    }).join("");
  }

  /* ---------- Event wiring ---------- */
  els.tabs.addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-tab");
    if(!btn) return;
    state.activeFilter = btn.dataset.channel;
    els.tabs.querySelectorAll(".filter-tab").forEach(t => t.setAttribute("aria-selected", t === btn ? "true" : "false"));
    render();
  });

  let searchDebounce;
  els.search.addEventListener("input", (e) => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => {
      state.searchQuery = e.target.value;
      render();
    }, 150);
  });

  els.list.addEventListener("click", (e) => {
    const row = e.target.closest(".conv-row");
    if(!row) return;
    openConversation(row.dataset.id);
  });

  /* ---------- Thread / chat view ---------- */
  function openConversation(id){
    const conv = state.conversations.find(c => c.id === id);
    if(!conv) return;

    if((conv.unread_count || 0) > 0){
      conv.unread_count = 0;
      if(supabase){
        supabase.from("conversations").update({ unread_count:0 }).eq("id", id)
          .then(({ error }) => { if(error) console.error("mark read error:", error); });
      }
    }

    els.listView.hidden = true;
    els.threadView.hidden = false;
    state.activeConversationId = id;

    renderThreadHeader(conv);
    loadMessages(conv);
  }

  function backToList(){
    els.threadView.hidden = true;
    els.listView.hidden = false;
    state.activeConversationId = null;
    if(messagesRealtimeChannel && supabase){
      supabase.removeChannel(messagesRealtimeChannel);
      messagesRealtimeChannel = null;
    }
    render();
  }

  function renderThreadHeader(conv){
    const avatarHtml = conv.customer_avatar
      ? `<img class="avatar" src="${escapeHtml(conv.customer_avatar)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'avatar-initials',style:'background:${hashColor(conv.customer_name||'?')}',textContent:'${initials(conv.customer_name)}'}))">`
      : `<div class="avatar-initials" style="background:${hashColor(conv.customer_name || "?")}">${initials(conv.customer_name)}</div>`;
    els.threadAvatarWrap.innerHTML = `${avatarHtml}<span class="channel-badge ${conv.channel}">${channelBadgeSvg(conv.channel)}</span>`;
    els.threadName.textContent = conv.customer_name || "Unknown";
    els.threadChannel.textContent = (CHANNEL_META[conv.channel] && CHANNEL_META[conv.channel].label) || conv.channel;
    els.threadChannel.className = "thread-channel " + conv.channel;
    els.composerInput.placeholder = `Message via ${(CHANNEL_META[conv.channel] && CHANNEL_META[conv.channel].label) || "chat"}...`;
  }

  async function loadMessages(conv){
    els.threadMessages.innerHTML = "";
    let messages = [];

    if(supabase){
      const { data, error } = await supabase
        .from("messages")
        .select("id, conversation_id, sender_type, content, created_at, channel")
        .eq("conversation_id", conv.id)
        .order("created_at", { ascending:true });
      if(error){
        console.error("loadMessages error:", error);
      }else{
        messages = data || [];
      }
      subscribeMessagesRealtime(conv.id);
    }else{
      messages = MOCK_MESSAGES[conv.id] || [];
    }

    renderMessages(messages);
  }

  function subscribeMessagesRealtime(conversationId){
    if(messagesRealtimeChannel){
      supabase.removeChannel(messagesRealtimeChannel);
    }
    messagesRealtimeChannel = supabase
      .channel("messages-" + conversationId)
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:`conversation_id=eq.${conversationId}` }, (payload) => {
        appendMessage(payload.new);
      })
      .subscribe();
  }

  function formatDayLabel(iso){
    const d = new Date(iso);
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    if(d.toDateString() === today.toDateString()) return "Today";
    if(d.toDateString() === yesterday.toDateString()) return "Yesterday";
    return d.toLocaleDateString(undefined, { month:"short", day:"numeric", year: d.getFullYear() !== today.getFullYear() ? "numeric" : undefined });
  }

  function buildDayDivider(iso){
    const el = document.createElement("div");
    el.className = "day-divider";
    el.textContent = formatDayLabel(iso);
    return el;
  }

  function buildMessageRow(m, tight){
    const row = document.createElement("div");
    row.className = `msg-row from-${m.sender_type}` + (tight ? " tight" : "");
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble";
    const text = document.createElement("div");
    text.className = "msg-bubble__text";
    text.textContent = m.content;
    const time = document.createElement("div");
    time.className = "msg-bubble__time";
    time.textContent = new Date(m.created_at).toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
    bubble.appendChild(text);
    bubble.appendChild(time);
    row.appendChild(bubble);
    return row;
  }

  function renderMessages(messages){
    els.threadMessages.innerHTML = "";
    let lastDateStr = null;
    let lastSender = null;
    messages.forEach(m => {
      const dateStr = new Date(m.created_at).toDateString();
      if(dateStr !== lastDateStr){
        els.threadMessages.appendChild(buildDayDivider(m.created_at));
        lastDateStr = dateStr;
        lastSender = null;
      }
      els.threadMessages.appendChild(buildMessageRow(m, m.sender_type === lastSender));
      lastSender = m.sender_type;
    });
    els.threadMessages.scrollTop = els.threadMessages.scrollHeight;
  }

  function appendMessage(m){
    const dividers = els.threadMessages.querySelectorAll(".day-divider");
    const lastDivider = dividers[dividers.length - 1];
    const label = formatDayLabel(m.created_at);
    if(!lastDivider || lastDivider.textContent !== label){
      els.threadMessages.appendChild(buildDayDivider(m.created_at));
    }
    els.threadMessages.appendChild(buildMessageRow(m, false));
    els.threadMessages.scrollTop = els.threadMessages.scrollHeight;

    const conv = state.conversations.find(c => c.id === m.conversation_id);
    if(conv){
      conv.last_message = m.content;
      conv.updated_at = m.created_at;
    }
  }

  function updateSendState(){
    els.sendBtn.disabled = els.composerInput.value.trim().length === 0;
  }

  function autoResizeComposer(){
    els.composerInput.style.height = "auto";
    els.composerInput.style.height = Math.min(els.composerInput.scrollHeight, 110) + "px";
  }

  els.composerInput.addEventListener("input", () => {
    updateSendState();
    autoResizeComposer();
  });

  els.composerInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      els.composerForm.requestSubmit();
    }
  });

  els.composerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const content = els.composerInput.value.trim();
    if(!content || !state.activeConversationId) return;

    const conv = state.conversations.find(c => c.id === state.activeConversationId);
    const message = {
      conversation_id: state.activeConversationId,
      sender_type: "admin",
      content,
      created_at: new Date().toISOString(),
      channel: conv ? conv.channel : null
    };

    appendMessage(message);
    els.composerInput.value = "";
    autoResizeComposer();
    updateSendState();

    if(supabase){
      const { error } = await supabase.from("messages").insert(message);
      if(error) console.error("sendMessage error:", error);
      if(conv){
        await supabase.from("conversations").update({ last_message: content, updated_at: message.created_at }).eq("id", conv.id);
      }
    }else if(conv){
      MOCK_MESSAGES[conv.id] = MOCK_MESSAGES[conv.id] || [];
      MOCK_MESSAGES[conv.id].push(message);
    }
  });

  document.getElementById("threadBackBtn").addEventListener("click", backToList);

  document.getElementById("attachBtn").addEventListener("click", () => {
    // TODO: wire up file/image attachment upload (e.g. Supabase Storage) per channel API constraints.
    console.log("Attach tapped");
  });

  document.getElementById("threadMoreBtn").addEventListener("click", () => {
    // TODO: surface conversation actions (view customer profile, mark unread, block, etc.)
    console.log("Thread options tapped");
  });

  document.getElementById("newMessageBtn").addEventListener("click", () => {
    // TODO: open the "start new conversation" flow.
    console.log("New message tapped");
  });

  document.querySelectorAll(".nav-item").forEach(btn => {
    btn.addEventListener("click", () => {
      // TODO: wire to real navigation between admin panel sections.
      console.log("Navigate to:", btn.dataset.nav);
    });
  });

  /* ---------- Boot ---------- */
  initSupabase();
})();
</script>
