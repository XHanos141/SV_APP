<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Store Order · SuppVerse BD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1621;--surface:#162130;--surface2:#1d2c3e;--line:rgba(255,255,255,.08);--t1:#eaf2f8;--t2:#9fb0c3;--t3:#657386;--purple:#7c6ff7;--green:#2f9b68;--orange:#F26430;--orange-t:#FF9466;--red:#d95353;--wa:#25D366;--fb:#1877F2;--ig:#E1306C;--web:#7c6ff7}
html[data-theme="light"]{--bg:#F4F7FB;--surface:#fff;--surface2:#EEF2F8;--line:rgba(0,0,0,.08);--t1:#001f3c;--t2:#64748B;--t3:#94a3b8;--orange-t:#E15A26}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t1);font-family:'DM Sans',system-ui,sans-serif}
.app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.back{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);color:var(--t1);display:flex;align-items:center;justify-content:center;cursor:pointer}
.back svg{width:18px;height:18px}
h1{margin:0;font:800 16px 'Plus Jakarta Sans',sans-serif}
main{flex:1;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:16px}
.label{font:800 11px 'Plus Jakarta Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--purple);margin:0 0 8px}
.card{background:rgba(124,111,247,.07);border:1px solid rgba(124,111,247,.18);border-radius:16px;padding:14px}
.b-guest{color:var(--red);background:rgba(217,83,83,.16)}
.rows{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--t2)}
.row a{color:inherit;text-decoration:none}
.verified svg{width:15px;height:15px;color:#2fd88a}
.rqid,.pxid{font:800 11.5px 'Plus Jakarta Sans',sans-serif;color:var(--orange-t);border-radius:7px;padding:3px 9px;letter-spacing:.3px;white-space:nowrap;background:rgba(242,100,48,.06)}
.rqid{border:1.5px solid rgba(242,100,48,.6)}
.pxid{border:1.5px dashed rgba(242,100,48,.6)}
.row.between{justify-content:space-between}
.row .lbl{display:inline-flex;align-items:center;gap:8px}
.row .val{font-weight:700;color:var(--t1)}
.ri2{width:16px;height:16px;flex-shrink:0;color:var(--t3);display:inline-flex}
.ri2 svg{width:16px;height:16px}
.req-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.status{font:800 11px 'Plus Jakarta Sans',sans-serif;color:var(--orange-t);background:rgba(242,100,48,.15);border-radius:8px;padding:4px 9px}
.req-top + .rows{margin-top:12px}
.call{width:20px;height:20px;border-radius:6px;background:var(--green);display:inline-flex;align-items:center;justify-content:center}
.call svg{width:11px;height:11px;color:#fff}
.pitem{display:grid;grid-template-columns:12px 1fr;gap:8px;align-items:start;padding:12px 0;border-bottom:1px dashed var(--line);color:inherit;text-decoration:none}
.pitem:first-child{padding-top:0}
.pitem:last-of-type{border-bottom:none;padding-bottom:0}
a.pitem:active{opacity:.7}
.pnum{font:800 14px/1.3 'Plus Jakarta Sans',sans-serif;color:var(--t3)}
.pbody{min-width:0}
.ptop{display:flex;align-items:flex-start;gap:8px}
.pname{flex:1;min-width:0;font:700 14px/1.3 'Plus Jakarta Sans',sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.aimark{display:inline-block;vertical-align:-2px;margin-left:5px;width:14px;height:14px;color:#F4A922}
.aimark svg{width:14px;height:14px;display:block}
.pgo{width:16px;height:16px;flex-shrink:0;margin-top:2px;color:var(--purple)}
.pgo svg{width:16px;height:16px;display:block}
.pbot{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:5px}
.pmeta{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 6px;font-size:12px;font-weight:700;min-width:0;color:var(--t2)}
.pdot{color:var(--t3)}
.pstore{color:var(--t1);font-weight:800}
.pprice{flex-shrink:0}
.ptotal{font:800 15px 'Plus Jakarta Sans',sans-serif;color:var(--green);white-space:nowrap}
.pnone{font:700 12px 'Plus Jakarta Sans',sans-serif;color:var(--t3)}
.psub{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;font-weight:700;color:var(--t2)}
.psub strong{font:800 15px 'Plus Jakarta Sans',sans-serif;color:var(--t1)}
.help{font-size:11.5px;font-weight:600;color:var(--t2);margin-top:8px;line-height:1.45}
.warn{font-size:12px;font-weight:600;color:var(--red);line-height:1.45}
.note{font-size:13px;font-weight:600;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.sum{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--t2);padding:4px 0}
.sum strong{color:var(--t1);font-weight:700}
.div{border-top:1px solid var(--line);margin:8px 0}
.tot{display:flex;justify-content:space-between;align-items:center}
.tot b{font:800 13px 'Plus Jakarta Sans',sans-serif}
.tot2{margin-top:10px}
.totval{display:inline-flex;align-items:center;gap:8px}
.totnum{font:800 17px 'Plus Jakarta Sans',sans-serif;color:var(--t1)}
.copybtn{position:relative;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#c4bdfd;background:rgba(124,111,247,.14);border:1px solid rgba(124,111,247,.3);cursor:pointer;padding:0}
html[data-theme="light"] .copybtn{color:#5b4fd6}
.copybtn::before{content:'';position:absolute;inset:-9px -7px}
.copybtn:active{transform:scale(.92);opacity:.7}
.copybtn svg{width:13px;height:13px}
.copybtn .idle,.copybtn .done{display:inline-flex}
.copybtn .done{display:none}
.copybtn.copied{color:#7cf0c2;background:rgba(47,216,138,.14);border-color:rgba(47,216,138,.4)}
.copybtn.copied .idle{display:none !important}
.copybtn.copied .done{display:inline-flex !important}
.state{margin:auto;text-align:center;color:var(--t2);font-weight:600;padding:40px 20px}
.toast.ok{background:#162130;border-color:rgba(255,255,255,.14);color:#fff}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:#2a0d0d;border:1px solid var(--red);color:#ffb4b4;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;display:none}

:root{--store:#0A9BDC;--store-t:#2DBEF5}
html[data-theme="light"]{--store-t:#0A86BE}
.card{background:rgba(124,111,247,.07);border:1px solid rgba(124,111,247,.18)}
.oid{font:800 11.5px 'Plus Jakarta Sans',sans-serif;color:var(--store-t);border:1.5px solid rgba(10,155,220,.6);border-radius:7px;padding:3px 9px;letter-spacing:.3px;white-space:nowrap;background:rgba(10,155,220,.07)}
.st-ok{color:#2fd88a;background:rgba(47,216,138,.15)}
.st-wait{color:var(--orange-t);background:rgba(242,100,48,.15)}
.st-bad{color:#ff8a8a;background:rgba(217,83,83,.16)}
.st-blue{color:var(--store-t);background:rgba(10,155,220,.15)}
.status.st-ok,.status.st-wait,.status.st-bad,.status.st-blue{}
.chdot{display:inline-flex;align-items:center;gap:6px}
.chdot i{width:9px;height:9px;border-radius:50%;display:inline-block}
.item{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px dashed var(--line)}
.item:first-child{padding-top:0}.item:last-of-type{border-bottom:none;padding-bottom:0}
.thumb{width:44px;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--t3)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:20px;height:20px}
.iname{font:700 14px/1.3 'Plus Jakarta Sans',sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.isku{font:700 11px 'Roboto Mono',ui-monospace,monospace;letter-spacing:.08em;color:var(--store-t);margin-top:3px}
.ibot{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.imeta{font-size:12px;font-weight:700;color:var(--t2)}
.itot{font:800 15px 'Plus Jakarta Sans',sans-serif;color:var(--green);white-space:nowrap}
.cat{display:inline-block;font:800 9.5px 'Plus Jakarta Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--t2);background:var(--surface2);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:1px}
.mono{font-family:'Roboto Mono',ui-monospace,monospace;letter-spacing:.04em}
.sum.disc strong{color:var(--red)}
.sum.free strong{color:var(--green)}
.paybadge{display:inline-flex;align-items:center;gap:8px;font:800 13px 'Plus Jakarta Sans',sans-serif}
.paybadge b{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px}
.cpv{display:inline-flex;align-items:center;gap:8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="back" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <h1>Store Order</h1>
  </header>
  <main id="root"><div class="state">Loading order…</div></main>
</div>
<div class="toast" id="toast"></div>

<script src="assets/js/sv-customer-card.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var CHANNELS={whatsapp:{label:'WhatsApp',color:'#25D366'},messenger:{label:'Messenger',color:'#1877F2'},facebook:{label:'Facebook',color:'#1877F2'},instagram:{label:'Instagram',color:'#E1306C'},website:{label:'Website',color:'#7c6ff7'},web:{label:'Website',color:'#7c6ff7'},admin:{label:'Direct',color:'#657386'}};
var STATUS={pending:['Pending','st-wait'],ordered:['Ordered','st-blue'],paid:['Paid','st-ok'],processing:['Processing','st-blue'],shipped:['Shipped','st-blue'],delivered:['Delivered','st-ok'],cancelled:['Cancelled','st-bad']};
var METHODS={bkash:['bKash','#e2136e'],nagad:['Nagad','#f26a21'],rocket:['Rocket','#8c3494'],upay:['Upay','#f9a61a'],cellfin:['Cellfin','#0b5ea8'],bank:['Bank Transfer','#2f6f9f'],crypto:['Crypto','#26a17b'],cod:['Cash on Delivery','#2f9b68'],cash:['Cash','#2f9b68'],card:['Card','#4b5bd6']};
var ICON_COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
var ICON_CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>';
var ICON_BOX='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>';
var CLOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function safeUrl(u){return /^https?:\/\//i.test(u||'')?u:'';}
function bdt(n){return '\u09f3'+Math.round(Number(n)||0).toLocaleString('en-US');}
function when(iso){var d=new Date(iso);if(isNaN(d))return '';var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];var h=d.getHours(),ap=h>=12?'pm':'am';h=h%12||12;return d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear()+', '+h+':'+('0'+d.getMinutes()).slice(-2)+' '+ap;}
function toast(m,ok){var t=document.getElementById('toast');t.textContent=m;t.className='toast'+(ok?' ok':'');t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none';},ok?1600:2600);}
async function copyText(text){
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true;}}catch(e){}
  try{var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0;';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);var ok=document.execCommand('copy');document.body.removeChild(ta);return ok;}catch(e){return false;}
}
document.addEventListener('click',function(e){
  var b=e.target.closest('.copybtn');if(!b)return;
  copyText(b.dataset.copy).then(function(ok){
    if(ok){b.classList.add('copied');setTimeout(function(){b.classList.remove('copied');},1400);toast(b.dataset.copy+' copied',true);}
    else toast("Couldn't copy \u2014 select and copy manually");
  });
});
function cbtn(v){return '<button type="button" class="copybtn" data-copy="'+esc(v)+'" aria-label="Copy"><span class="idle">'+ICON_COPY+'</span><span class="done">'+ICON_CHECK+'</span></button>';}

/* order = orders row + order_items[]; cust = customers row|null; pay = {intent, tx}|null */
function renderStoreOrder(o,cust,pay){
  var items=(o.order_items||[]).map(function(i){return{name:i.product_name||'Unnamed product',img:i.product_image||'',qty:Math.max(1,parseInt(i.quantity,10)||1),price:Number(i.unit_price)||0,sku:i.sku||'',cat:i.category||''};});
  var subtotal=Number(o.subtotal)||items.reduce(function(a,i){return a+i.qty*i.price;},0);
  var ship=Number(o.shipping)||0, disc=Number(o.discount)||0;
  var total=o.total_amount!=null?Number(o.total_amount):Math.max(0,subtotal-disc+ship);
  var st=STATUS[o.status]||[String(o.status||'').replace(/_/g,' '),'st-wait'];
  var chKey=o.channel||o.source||'website', ch=CHANNELS[chKey]||CHANNELS.website;
  var mKey=String(o.payment_method||'').toLowerCase(), m=METHODS[mKey]||[o.payment_method||'Not chosen','#657386'];
  var tx=pay&&pay.tx||null, intent=pay&&pay.intent||null;
  var ref=o.payment_ref||(tx&&tx.transaction_id)||'';
  var sender=(tx&&tx.sender_account)||(intent&&intent.expected_sender_account)||'';
  var payState, payCls;
  if(o.status==='cancelled'){payState='Cancelled';payCls='st-bad';}
  else if(o.paid_at||o.status==='paid'||o.status==='processing'||o.status==='shipped'||o.status==='delivered'){payState='Paid';payCls='st-ok';}
  else if(mKey==='cod'){payState='Pay on delivery';payCls='st-blue';}
  else if(ref){payState='Verifying';payCls='st-wait';}
  else{payState='Awaiting payment';payCls='st-wait';}
  var addr=[o.district,o.address_text].filter(Boolean).join(', ')||o.delivery_address||'';
  var c=cust||null, registered=!!(c&&c.customer_code&&!c.is_guest);
  var name=(c&&c.full_name)||o.customer_name||'Guest', phone=(c&&c.phone)||o.customer_phone||'';
  var h='';
  h+='<section><div class="label">Customer Info</div><div id="custCard"></div></section>';
  h+='<section><div class="label">Order</div><div class="card">'
    +'<div class="req-top"><span class="status '+st[1]+'">'+esc(st[0])+'</span>'+(o.order_number?'<span class="oid">'+esc(o.order_number)+'</span>':'')+'</div>'
    +'<div class="rows">'
    +'<div class="row between"><span class="lbl"><span class="ri2">'+CLOCK+'</span>Placed</span><span class="val">'+esc(when(o.created_at))+'</span></div>'
    +'<div class="row between"><span class="lbl">Source</span><span class="val chdot"><i style="background:'+ch.color+'"></i>'+esc(ch.label)+'</span></div>'
    +'</div></div></section>';
  var rows=items.map(function(i,idx){
    var u=safeUrl(i.img);
    return '<div class="item"><div class="thumb">'+(u?'<img src="'+esc(u)+'" alt="" loading="lazy">':ICON_BOX)+'</div>'
      +'<div><div class="iname">'+esc(i.name)+'</div>'
      +'<div class="isku">'+esc(i.sku||'No SKU')+(i.cat?'<span class="cat">'+esc(i.cat)+'</span>':'')+'</div>'
      +'<div class="ibot"><span class="imeta">'+i.qty+' \u00d7 '+bdt(i.price)+'</span><span class="itot">'+bdt(i.qty*i.price)+'</span></div></div></div>';
  }).join('');
  h+='<section><div class="label">Ordered Products ('+items.length+')</div><div class="card">'+(rows||'<div class="pnone">No items on this order</div>')
    +'<div class="psub"><span>Items subtotal</span><strong>'+bdt(subtotal)+'</strong></div></div></section>';
  h+='<section><div class="label">Payment Details</div><div class="card">'
    +'<div class="req-top"><span class="paybadge"><b style="background:'+m[1]+'">'+esc(String(m[0]).slice(0,2).toUpperCase())+'</b>'+esc(m[0])+'</span><span class="status '+payCls+'">'+esc(payState)+'</span></div>'
    +'<div class="rows">'
    +(ref?'<div class="row between"><span class="lbl">Transaction ID</span><span class="cpv"><span class="val mono">'+esc(ref)+'</span>'+cbtn(ref)+'</span></div>':(mKey==='cod'?'':'<div class="row between"><span class="lbl">Transaction ID</span><span class="val" style="color:var(--t3)">Not submitted</span></div>'))
    +(sender?'<div class="row between"><span class="lbl">Sender number</span><span class="cpv"><span class="val mono">'+esc(sender)+'</span>'+cbtn(sender)+'</span></div>':'')
    +(tx&&tx.amount!=null?'<div class="row between"><span class="lbl">Amount received</span><span class="val">'+bdt(tx.amount)+'</span></div>':'')
    +'<div class="row between"><span class="lbl">Amount due</span><span class="val">'+bdt(total)+'</span></div>'
    +(tx&&tx.verification_status?'<div class="row between"><span class="lbl">Auto-verify</span><span class="val">'+esc(String(tx.verification_status).replace(/_/g,' '))+'</span></div>':'')
    +(o.payment_submitted_at?'<div class="row between"><span class="lbl">Submitted</span><span class="val">'+esc(when(o.payment_submitted_at))+'</span></div>':'')
    +(o.paid_at?'<div class="row between"><span class="lbl">Paid at</span><span class="val">'+esc(when(o.paid_at))+'</span></div>':'')
    +'</div></div></section>';
  h+='<section><div class="label">Order Summary</div><div class="card">'
    +'<div class="sum"><span>Subtotal</span><strong>'+bdt(subtotal)+'</strong></div>'
    +'<div class="sum '+(ship===0?'free':'')+'"><span>Shipping</span><strong>'+(ship===0?'FREE':bdt(ship))+'</strong></div>'
    +(disc>0?'<div class="sum disc"><span>'+(o.voucher_code?'Voucher '+esc(o.voucher_code):'Discount')+'</span><strong>-'+bdt(disc)+'</strong></div>':'')
    +'<div class="div"></div><div class="tot"><b>Total</b><span class="totval"><span class="totnum">'+bdt(total)+'</span>'+cbtn(bdt(total))+'</span></div></div></section>';
  document.getElementById('root').innerHTML=h;
  SVCustomerCard.mount(document.getElementById('custCard'),{
    name:name,customer_id:(c&&c.customer_code)||'',customer_since:(c&&c.created_at)||'',
    phone:phone,email:(c&&c.email)||'',address:addr,avatar_url:(c&&c.avatar_url)||'',verified:registered
  });
}

function demoOrder(){
  return {order:{id:'demo',order_number:'SV-1014',status:'pending',channel:'facebook',source:'admin',created_at:new Date(Date.now()-12*60000).toISOString(),
    subtotal:9500,shipping:0,discount:500,total_amount:9000,voucher_code:'SUP-REG7K2QX',payment_method:'bkash',payment_ref:'BK7F2L9Q3X',payment_submitted_at:new Date(Date.now()-6*60000).toISOString(),
    district:'Dhaka',address_text:'House 7, Road 3, Mirpur',customer_name:'Rafiq Ahmed',customer_phone:'+880 1712-345678',
    order_items:[{product_name:'Magnesium Glycinate 120ct',quantity:2,unit_price:3250,sku:'DB-MAG-GLY-120',category:'Supplement',product_image:''},{product_name:'Betaine HCL & Pepsin 120ct',quantity:1,unit_price:3000,sku:'DB-HCI-PEP-120',category:'Supplement',product_image:''}]},
    cust:null,pay:{intent:{expected_sender_account:'01712345678'},tx:null}};
}
function post(m){try{if(window.parent&&window.parent!==window)window.parent.postMessage(m,'*');}catch(e){}}
document.getElementById('backBtn').onclick=function(){if(window.parent&&window.parent!==window)post({type:'sv-so-close'});else history.back();};

(function boot(){
  var q=new URLSearchParams(location.search);
  if(q.get('theme')==='light')document.documentElement.setAttribute('data-theme','light');
  if(q.get('demo')==='1'){var d=demoOrder();renderStoreOrder(d.order,d.cust,d.pay);return;}
  var id=q.get('id');if(!id)return;
  var client=null;
  try{client=window.supabase.createClient('https://tlkoxltugvfwxmnrthvr.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsa294bHR1Z3Zmd3htbnJ0aHZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwOTIxNTIsImV4cCI6MjEwMzY2ODE1Mn0.UMFWCIPoNJn5kAX5v9OXVkH3wmxp_dtDG7dgNQ3BK7E');}catch(e){}
  if(!client){document.getElementById('root').innerHTML='<div class="state">Could not connect. Check your internet and try again.</div>';return;}
  (async function(){
    try{
      var r=await client.from('orders').select('*,order_items(id,product_name,product_image,quantity,unit_price,sku,category)').eq('id',id).maybeSingle();
      if(r.error)throw r.error;
      if(!r.data){document.getElementById('root').innerHTML='<div class="state">Order not found, or you do not have access.</div>';return;}
      var o=r.data,cust=null,pay=null;
      try{if(o.customer_id){var cr=await client.from('customers').select('full_name,phone,email,customer_code,avatar_url,address_text,district,created_at,is_guest').eq('id',o.customer_id).maybeSingle();cust=cr.data||null;}}catch(e){}
      try{var pr=await client.from('payment_intents').select('expected_sender_account,expected_amount,status,payment_transactions(transaction_id,amount,sender_account,verification_status,transaction_time)').eq('order_id',o.id).order('created_at',{ascending:false}).limit(1);
        var it=pr.data&&pr.data[0];if(it){var txs=it.payment_transactions;pay={intent:it,tx:Array.isArray(txs)?txs[0]:txs||null};}}catch(e){}
      renderStoreOrder(o,cust,pay);
    }catch(e){console.error(e);document.getElementById('root').innerHTML='<div class="state">Could not load this order.</div>';}
  })();
})();
</script>
