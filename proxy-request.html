<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Buy For Me Request · SuppVerse BD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1621;--surface:#162130;--surface2:#1d2c3e;--line:rgba(255,255,255,.08);--t1:#eaf2f8;--t2:#9fb0c3;--t3:#657386;--purple:#7c6ff7;--green:#2f9b68;--orange:#F26430;--orange-t:#FF9466;--red:#d95353;--wa:#25D366;--fb:#1877F2;--ig:#E1306C;--web:#7c6ff7}
html[data-theme="light"]{--bg:#F4F7FB;--surface:#fff;--surface2:#EEF2F8;--line:rgba(0,0,0,.08);--t1:#001f3c;--t2:#64748B;--t3:#94a3b8;--orange-t:#E15A26}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t1);font-family:'DM Sans',system-ui,sans-serif}
.app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.back{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);color:var(--t1);display:flex;align-items:center;justify-content:center;cursor:pointer}
.back svg{width:18px;height:18px}
h1{margin:0;font:800 16px 'Plus Jakarta Sans',sans-serif}
main{flex:1;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:16px}
.label{font:800 11px 'Plus Jakarta Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--purple);margin:0 0 8px}
.card{background:rgba(124,111,247,.07);border:1px solid rgba(124,111,247,.18);border-radius:16px;padding:14px}
.b-guest{color:var(--red);background:rgba(217,83,83,.16)}
.rows{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--t2)}
.row a{color:inherit;text-decoration:none}
.verified svg{width:15px;height:15px;color:#2fd88a}
.rqid,.pxid{font:800 11.5px 'Plus Jakarta Sans',sans-serif;color:var(--orange-t);border-radius:7px;padding:3px 9px;letter-spacing:.3px;white-space:nowrap;background:rgba(242,100,48,.06)}
.rqid{border:1.5px solid rgba(242,100,48,.6)}
.pxid{border:1.5px dashed rgba(242,100,48,.6)}
.row.between{justify-content:space-between}
.row .lbl{display:inline-flex;align-items:center;gap:8px}
.row .val{font-weight:700;color:var(--t1)}
.ri2{width:16px;height:16px;flex-shrink:0;color:var(--t3);display:inline-flex}
.ri2 svg{width:16px;height:16px}
.req-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.status{font:800 11px 'Plus Jakarta Sans',sans-serif;color:var(--orange-t);background:rgba(242,100,48,.15);border-radius:8px;padding:4px 9px}
.req-top + .rows{margin-top:12px}
.call{width:20px;height:20px;border-radius:6px;background:var(--green);display:inline-flex;align-items:center;justify-content:center}
.call svg{width:11px;height:11px;color:#fff}
.pitem{display:grid;grid-template-columns:12px 1fr;gap:8px;align-items:start;padding:12px 0;border-bottom:1px dashed var(--line);color:inherit;text-decoration:none}
.pitem:first-child{padding-top:0}
.pitem:last-of-type{border-bottom:none;padding-bottom:0}
a.pitem:active{opacity:.7}
.pnum{font:800 14px/1.3 'Plus Jakarta Sans',sans-serif;color:var(--t3)}
.pbody{min-width:0}
.ptop{display:flex;align-items:flex-start;gap:8px}
.pname{flex:1;min-width:0;font:700 14px/1.3 'Plus Jakarta Sans',sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.aimark{display:inline-block;vertical-align:-2px;margin-left:5px;width:14px;height:14px;color:#F4A922}
.aimark svg{width:14px;height:14px;display:block}
.pgo{width:16px;height:16px;flex-shrink:0;margin-top:2px;color:var(--purple)}
.pgo svg{width:16px;height:16px;display:block}
.pbot{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:5px}
.pmeta{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 6px;font-size:12px;font-weight:700;min-width:0;color:var(--t2)}
.pdot{color:var(--t3)}
.pstore{color:var(--t1);font-weight:800}
.pprice{flex-shrink:0}
.ptotal{font:800 15px 'Plus Jakarta Sans',sans-serif;color:var(--green);white-space:nowrap}
.pnone{font:700 12px 'Plus Jakarta Sans',sans-serif;color:var(--t3)}
.psub{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;font-weight:700;color:var(--t2)}
.psub strong{font:800 15px 'Plus Jakarta Sans',sans-serif;color:var(--t1)}
.help{font-size:11.5px;font-weight:600;color:var(--t2);margin-top:8px;line-height:1.45}
.warn{font-size:12px;font-weight:600;color:var(--red);line-height:1.45}
.note{font-size:13px;font-weight:600;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.sum{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--t2);padding:4px 0}
.sum strong{color:var(--t1);font-weight:700}
.div{border-top:1px solid var(--line);margin:8px 0}
.tot{display:flex;justify-content:space-between;align-items:center}
.tot b{font:800 13px 'Plus Jakarta Sans',sans-serif}
.tot2{margin-top:10px}
.totval{display:inline-flex;align-items:center;gap:8px}
.totnum{font:800 17px 'Plus Jakarta Sans',sans-serif;color:var(--t1)}
.copybtn{position:relative;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#c4bdfd;background:rgba(124,111,247,.14);border:1px solid rgba(124,111,247,.3);cursor:pointer;padding:0}
html[data-theme="light"] .copybtn{color:#5b4fd6}
.copybtn::before{content:'';position:absolute;inset:-9px -7px}
.copybtn:active{transform:scale(.92);opacity:.7}
.copybtn svg{width:13px;height:13px}
.copybtn .idle,.copybtn .done{display:inline-flex}
.copybtn .done{display:none}
.copybtn.copied{color:#7cf0c2;background:rgba(47,216,138,.14);border-color:rgba(47,216,138,.4)}
.copybtn.copied .idle{display:none !important}
.copybtn.copied .done{display:inline-flex !important}
.state{margin:auto;text-align:center;color:var(--t2);font-weight:600;padding:40px 20px}
.toast.ok{background:#162130;border-color:rgba(255,255,255,.14);color:#fff}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:#2a0d0d;border:1px solid var(--red);color:#ffb4b4;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="back" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <h1>Buy For Me Request</h1>
  </header>
  <main id="root"><div class="state">Loading request…</div></main>
</div>
<div class="toast" id="toast"></div>
<script src="assets/js/sv-customer-card.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var CHANNELS={whatsapp:{label:'WhatsApp',color:'#25D366'},messenger:{label:'Messenger',color:'#1877F2'},facebook:{label:'Messenger',color:'#1877F2'},instagram:{label:'Instagram',color:'#E1306C'},website:{label:'Website',color:'#7c6ff7'}};
var STATUS={pending_quote:'Awaiting quote',quoted:'Quote sent',approved:'Awaiting payment',paid:'Paid',purchasing:'Purchasing',ordered:'Ordered',shipped_intl:'Shipped',arrived_bd:'Arrived in BD',delivered:'Delivered',rejected:'Rejected',cancelled:'Cancelled',expired:'Quote expired'};
var CUR={id:null,channel:'website'};
var ICON_COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
var ICON_CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>';
var ICON_CHAT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-1.3 4.5A8.5 8.5 0 0112 20.5a8.4 8.4 0 01-4-1L3 21l1.5-4.7a8.4 8.4 0 01-1-4.3 8.5 8.5 0 014.5-7.5A8.4 8.4 0 0111.5 3H12a8.5 8.5 0 019 8v.5z"/></svg>';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function safeUrl(u){
  u=String(u||'').trim().replace(/\s+/g,'');
  if(!u) return '';
  if(/^https?:\/\//i.test(u)) return u;
  if(/^[a-z][a-z0-9+.-]*:/i.test(u)) return '';           /* other schemes (javascript:, data:) blocked */
  if(/^(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)+(\/|\?|#|$)/i.test(u)) return 'https://'+u;  /* iherb.com/..., www.x.com/... */
  return '';
}
/* Open product links reliably: new tab first, fall back to the parent app if the browser blocks it */
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a.pitem'); if(!a) return;
  e.preventDefault();
  var u=a.getAttribute('href'); if(!u) return;
  var w=null; try{ w=window.open(u,'_blank'); }catch(x){}
  if(w){ try{ w.opener=null; }catch(x){} return; }
  try{ parent.postMessage({type:'sv-open-url',url:u},'*'); }catch(x){}
});
function usd(n){return '$'+(Number(n)||0).toFixed(2);}
function bdt(n){return '৳'+Math.round(Number(n)||0).toLocaleString('en-US');}
function when(iso){
  var d=new Date(iso); if(isNaN(d)) return '';
  var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var h=d.getHours(), ap=h>=12?'pm':'am'; h=h%12||12;
  return d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear()+', '+h+':'+('0'+d.getMinutes()).slice(-2)+' '+ap;
}
function initials(n){var p=String(n||'?').trim().split(/\s+/);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();}
function toast(m,ok){var t=document.getElementById('toast');t.textContent=m;t.className='toast'+(ok?' ok':'');t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none';},ok?1600:2600);}
async function copyText(text){
  try{ if(navigator.clipboard&&window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
  try{ var ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0;'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,text.length); var ok=document.execCommand('copy'); document.body.removeChild(ta); return ok; }catch(e){ return false; }
}
document.addEventListener('click',function(e){
  var b=e.target.closest('.copybtn'); if(!b) return;
  copyText(b.dataset.copy).then(function(ok){
    if(ok){ b.classList.add('copied'); setTimeout(function(){ b.classList.remove('copied'); },1400); toast(b.dataset.copy+' copied',true); }
    else toast("Couldn't copy — select and copy manually");
  });
});

/* Public entry point: render(row, fees). row = proxy_requests row joined with customers + orders. */
function renderProxyRequest(row, fees){
  var snap=row.product_snapshot||{};
  var items=(Array.isArray(snap.items)&&snap.items.length)?snap.items:[{name:snap.name,store:snap.store,url:row.source_url,qty:snap.qty,price:snap.price,ai:snap.ai}];
  items=items.map(function(i){return{name:i.name||'Unnamed product',store:i.store||'',url:i.url||'',qty:Math.max(1,parseInt(i.qty,10)||1),price:Number(i.price)||0,ai:!!i.ai};});
  var c=row.customers||null;
  var registered=!!(c&&(row.customer_id||c.customer_code));
  var name=(c&&c.full_name)||snap.name_guess||'Guest';
  var phone=snap.whatsapp||(c&&c.phone)||'';
  var address=c?[c.district,c.address_text].filter(Boolean).join(', '):'';
  var chKey=(snap.contact&&snap.contact.channel)||'website';
  var ch=CHANNELS[chKey]||CHANNELS.website;
  var reqNo=row.request_no||'';
  var pxNo=(row.orders&&row.orders.order_number)||'';
  var status=STATUS[row.status||'pending_quote']||String(row.status||'').replace(/_/g,' ');
  CUR.id=row.id; CUR.channel=chKey; CUR.phone=phone; CUR.name=name; CUR.px=reqNo;
  var productUsd=items.reduce(function(a,i){return a+i.qty*i.price;},0);
  var est=null;
  if(fees&&Number(fees.usd_rate)>0){
    var tax=productUsd*(Number(fees.sales_tax)||0)/100, svc=productUsd*(Number(fees.service_charge)||0)/100;
    est={tax:tax,svc:svc,total:productUsd+tax+svc,rate:Number(fees.usd_rate),taxPct:Number(fees.sales_tax)||0,svcPct:Number(fees.service_charge)||0};
    est.bdt=est.total*est.rate;
  }
    var phoneClean=String(phone).replace(/[^\d+]/g,'');
  var avatar=(c&&c.avatar_url&&safeUrl(c.avatar_url))?'<img class="avatar" src="'+esc(c.avatar_url)+'" alt="">':'<div class="avatar">'+esc(initials(name))+'</div>';
  var h='';
  h+='<section><div class="label">Customer Info</div><div id="custCard"></div></section>';
  var CLOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>';
  h+='<section><div class="label">Request</div><div class="card">'
    +'<div class="req-top"><span class="status">'+esc(status)+'</span>'+(reqNo?'<span class="rqid">'+esc(reqNo)+'</span>':'')+'</div>'
    +'<div class="rows">'
    +'<div class="row between"><span class="lbl"><span class="ri2">'+CLOCK+'</span>Submitted</span><span class="val">'+esc(when(row.created_at))+'</span></div>'
    +(pxNo?'<div class="row between"><span class="lbl">Order</span><span class="pxid">'+esc(pxNo)+'</span></div>':'')
    +'</div></div></section>';
  var SPARK='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.3 6.7L21 11l-6.7 2.3L12 20l-2.3-6.7L3 11l6.7-2.3z"/></svg>';
  var OUT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
  var rowsHtml=items.map(function(i,idx){
    var u=safeUrl(i.url), tag=u?'a':'div';
    var lineTotal=i.price*i.qty;
    var chip='<span class="pnum">'+(idx+1)+'</span>';
    var priceHtml=i.price?'<span class="pprice"><span class="ptotal">'+usd(lineTotal)+'</span></span>':'<span class="pnone">No price</span>';
    var qtyTxt=i.price?(i.qty+' × '+usd(i.price)):('Qty '+i.qty);
    return '<'+tag+' class="pitem"'+(u?' href="'+esc(u)+'" target="_blank" rel="noopener noreferrer" aria-label="Open '+esc(i.name)+' in a new tab"':'')+'>'
      +chip+'<div class="pbody"><div class="ptop"><div class="pname">'+esc(i.name)+(i.ai?'<span class="aimark" role="img" aria-label="AI-filled" title="AI-filled">'+SPARK+'</span>':'')+'</div>'+(u?'<span class="pgo">'+OUT+'</span>':'')+'</div>'
      +'<div class="pbot"><div class="pmeta"><span class="pstore">'+esc(i.store||'Store not detected')+'</span><span class="pdot">·</span><span>'+qtyTxt+'</span></div>'+priceHtml+'</div></div></'+tag+'>';
  }).join('');
  h+='<section><div class="label">Requested Products ('+items.length+')</div><div class="card">'+rowsHtml
    +'<div class="psub"><span>Items subtotal</span><strong>'+usd(productUsd)+'</strong></div></div>'
    +'</section>';
  if(snap.notes) h+='<section><div class="label">Customer Notes</div><div class="card"><div class="note">'+esc(snap.notes)+'</div></div></section>';
  h+='<section><div class="label">Cost Estimate</div><div class="card">'
    +(est?'<div class="sum"><span>Product cost</span><strong>'+usd(productUsd)+'</strong></div>'
      +'<div class="sum"><span>US Sales Tax ('+est.taxPct+'%)</span><strong>'+usd(est.tax)+'</strong></div>'
      +'<div class="sum"><span>Service Charge ('+est.svcPct+'%)</span><strong>'+usd(est.svc)+'</strong></div>'
      +'<div class="sum"><span>Rate</span><strong>1 USD = ৳'+est.rate+'</strong></div><div class="div"></div>'
      +(row.quote_total!=null?'<div class="sum"><span>Final price sent</span><strong>'+bdt(row.quote_total)+'</strong></div>':'')
      +'<div class="tot"><b>Total (USD)</b><span class="totval"><span class="totnum">'+usd(est.total)+'</span><button type="button" class="copybtn" data-copy="'+usd(est.total)+'" aria-label="Copy total"><span class="idle">'+ICON_COPY+'</span><span class="done">'+ICON_CHECK+'</span></button></span></div>'
      +'<div class="tot tot2"><b>Total (BDT)</b><span class="totval"><span class="totnum">'+bdt(est.bdt)+'</span><button type="button" class="copybtn" data-copy="'+bdt(est.bdt)+'" aria-label="Copy total"><span class="idle">'+ICON_COPY+'</span><span class="done">'+ICON_CHECK+'</span></button></span></div>'
     :'<div class="warn">Fee settings are not saved yet. Open Website → Buy For Me → Fee &amp; Markup Rates and press Save Changes.</div>')
    +'</div></section>';
  document.getElementById('root').innerHTML=h;
  SVCustomerCard.mount(document.getElementById('custCard'),{
    name:name, customer_id:(c&&c.customer_code)||'', customer_since:(c&&c.created_at)||'',
    phone:(c&&c.phone)||'', email:(c&&c.email)||'', address:address, avatar_url:(c&&c.avatar_url)||'', verified:registered
  });
}

function post(m){try{if(window.parent&&window.parent!==window)window.parent.postMessage(m,'*');}catch(e){}}
document.getElementById('backBtn').onclick=function(){ if(window.parent&&window.parent!==window) post({type:'sv-px-close'}); else history.back(); };

(function boot(){
  var q=new URLSearchParams(location.search);
  if(q.get('theme')==='light') document.documentElement.setAttribute('data-theme','light');
  var id=q.get('id'); if(!id) return;   /* no id: wait for renderProxyRequest() to be called */
  var client=null;
  try{ client=window.supabase.createClient('https://tlkoxltugvfwxmnrthvr.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsa294bHR1Z3Zmd3htbnJ0aHZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwOTIxNTIsImV4cCI6MjEwMzY2ODE1Mn0.UMFWCIPoNJn5kAX5v9OXVkH3wmxp_dtDG7dgNQ3BK7E', {auth:{persistSession:true,autoRefreshToken:false}}); }catch(e){}
  if(!client){ document.getElementById('root').innerHTML='<div class="state">Could not connect. Check your internet and try again.</div>'; return; }
  (async function(){
    try{
      var r=await client.from('proxy_requests').select('*,customers(full_name,phone,email,customer_code,avatar_url,address_text,district,created_at),orders(order_number)').eq('id',id).maybeSingle();
      if(r.error) throw r.error;
      if(!r.data){ document.getElementById('root').innerHTML='<div class="state">Request not found, or you do not have access.</div>'; return; }
      var f=await client.from('site_content').select('content').eq('page','buy_for_me').eq('section','fees').maybeSingle();
      renderProxyRequest(r.data,(f.data&&f.data.content)||null);
    }catch(e){ console.error(e); document.getElementById('root').innerHTML='<div class="state">Could not load this request.</div>'; }
  })();
})();
</script>
</body>
</html>
