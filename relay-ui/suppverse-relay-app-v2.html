<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1f29" id="metaTheme">
<title>SuppVerseBD Relay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Plus+Jakarta+Sans:wght@700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style id="theme-dark">
:root{
  --bg:#1a1f29; --shadow-d:#12161e; --shadow-l:#242c3a;
  --text:#f2f5fb; --dim:#b4c0d4; --faint:#8393ab; --mute:#5f6f88;
  --brand:#a79dff; --brand-soft:rgba(167,157,255,.16);
  --green:#3ecb8a; --green-soft:rgba(62,203,138,.16);
  --amber:#ecb04c; --amber-soft:rgba(236,176,76,.16);
  --red:#ff7b72; --red-soft:rgba(255,123,114,.16);
}
</style>
<style id="theme-light" disabled>
:root{
  --bg:#e6e9ef; --shadow-d:#b8bec9; --shadow-l:#ffffff;
  --text:#1a2030; --dim:#465269; --faint:#5b657b; --mute:#8a95aa;
  --brand:#5645d1; --brand-soft:rgba(86,69,209,.12);
  --green:#146641; --green-soft:rgba(37,148,95,.12);
  --amber:#785307; --amber-soft:rgba(185,133,42,.13);
  --red:#a43028; --red-soft:rgba(210,77,67,.11);
}
</style>
<style>
:root{
  --r-sm:14px; --r-md:18px; --r-lg:26px;
  --ease-spring:cubic-bezier(.32,.72,0,1);
  --ease-out:cubic-bezier(.22,.8,.28,1);
  --fs-2xs:10px; --fs-xs:11px; --fs-sm:12px; --fs-base:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:22px;
  /* Option C — tight & crisp */
  --sh-out-sm:3px 3px 5px var(--shadow-d),-3px -3px 5px var(--shadow-l);
  --sh-out-md:6px 6px 8px var(--shadow-d),-6px -6px 8px var(--shadow-l);
  --sh-out-lg:10px 10px 12px var(--shadow-d),-10px -10px 12px var(--shadow-l);
  --sh-in-sm:inset 3px 3px 5px var(--shadow-d),inset -3px -3px 5px var(--shadow-l);
  --sh-in-md:inset 4px 4px 6px var(--shadow-d),inset -4px -4px 6px var(--shadow-l);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  display:flex;justify-content:center;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);
  transition:background-color .35s var(--ease-out),color .35s var(--ease-out);
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;}
.app{width:100%;max-width:420px;min-height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg);}
::selection{background:var(--brand-soft);}

/* header */
.topbar{padding:16px 16px 14px;position:sticky;top:0;z-index:5;background:var(--bg);}
.topbar-inner{display:flex;align-items:center;gap:11px;}
.mark{width:38px;height:38px;border-radius:13px;flex-shrink:0;background:var(--bg);box-shadow:var(--sh-out-sm);display:flex;align-items:center;justify-content:center;}
.mark svg{width:18px;height:18px;color:var(--brand);}
.titles{flex:1;min-width:0;}
.topbar h1{font-family:'Plus Jakarta Sans';font-weight:700;font-size:var(--fs-lg);margin:0;letter-spacing:-.008em;line-height:1.25;}
.topbar .sub{font-size:var(--fs-2xs);color:var(--faint);margin-top:2px;display:flex;align-items:center;gap:5px;font-weight:500;}
.sub .pdot{width:5px;height:5px;border-radius:50%;background:var(--mute);flex-shrink:0;}
.pill{font-size:var(--fs-2xs);font-weight:700;padding:5px 10px;border-radius:99px;flex-shrink:0;display:flex;align-items:center;gap:5px;position:relative;}
.pill::before{content:"";width:5.5px;height:5.5px;border-radius:50%;background:currentColor;}
.pill.op{background:var(--green-soft);color:var(--green);}
.pill.deg{background:var(--amber-soft);color:var(--amber);}
.pill.off{background:var(--red-soft);color:var(--red);}
.pill.deg::after,.pill.off::after{content:"";position:absolute;left:10px;top:50%;width:5.5px;height:5.5px;margin:-2.75px 0 0;border-radius:50%;border:1.5px solid currentColor;opacity:0;animation:pring 2s var(--ease-out) infinite;pointer-events:none;}
@keyframes pring{0%{transform:scale(.6);opacity:.8;}100%{transform:scale(3);opacity:0;}}
.icon-btn{width:34px;height:34px;border-radius:12px;flex-shrink:0;background:var(--bg);box-shadow:var(--sh-out-sm);display:flex;align-items:center;justify-content:center;color:var(--dim);transition:box-shadow .18s var(--ease-out),transform .15s var(--ease-out);}
.icon-btn:active{box-shadow:var(--sh-in-sm);transform:scale(.96);}
.icon-btn svg{width:16px;height:16px;}

/* content */
.content{flex:1;overflow-y:auto;padding:14px 14px 96px;overscroll-behavior:contain;scrollbar-width:none;transition:opacity .16s var(--ease-out),transform .16s var(--ease-out);}
.content::-webkit-scrollbar{display:none;}
.content.leaving{opacity:0;transform:translateY(5px);}
.content>*{animation:rise .38s var(--ease-out) both;}
.content>*:nth-child(2){animation-delay:.03s;} .content>*:nth-child(3){animation-delay:.06s;} .content>*:nth-child(4){animation-delay:.09s;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.card{background:var(--bg);border-radius:var(--r-lg);padding:18px;margin-bottom:16px;box-shadow:var(--sh-out-md);transition:box-shadow .25s var(--ease-out),background-color .35s;}
.pressable{transition:transform .16s var(--ease-out);}
.pressable:active{transform:scale(.975);}
.card h2{font-family:'Plus Jakarta Sans';font-size:var(--fs-sm);font-weight:700;margin:0 0 13px;display:flex;align-items:center;gap:7px;color:var(--text);letter-spacing:-.005em;}
.card h2 .range{margin-left:auto;font-weight:500;font-size:var(--fs-2xs);color:var(--faint);font-family:'Roboto Mono';}

.status-card{display:flex;align-items:center;gap:14px;padding:2px;}
.status-card .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;position:relative;}
.status-card .dot.op{background:var(--green);} .status-card .dot.deg{background:var(--amber);} .status-card .dot.off{background:var(--red);}
.status-card .dot.deg::after,.status-card .dot.off::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid currentColor;opacity:0;animation:ring 2.2s var(--ease-out) infinite;}
@keyframes ring{0%{transform:scale(.6);opacity:.7;}100%{transform:scale(1.5);opacity:0;}}
.status-card .dot.deg::after{border-color:var(--amber);} .status-card .dot.off::after{border-color:var(--red);}
.status-card .t{font-family:'Plus Jakarta Sans';font-weight:700;font-size:var(--fs-md);letter-spacing:-.008em;}
.status-card .s{font-size:var(--fs-xs);color:var(--dim);margin-top:2px;line-height:1.4;}

.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.metric{background:var(--bg);border-radius:var(--r-md);padding:13px 14px;box-shadow:var(--sh-in-sm);}
.metric{animation:tile .6s var(--ease-out) both;animation-delay:calc(var(--i,0)*80ms + 120ms);}
@keyframes tile{from{opacity:0;transform:translateY(10px) scale(.95);}to{opacity:1;transform:none;}}
.metric .v{font-family:'Plus Jakarta Sans';font-weight:800;font-size:var(--fs-xl);letter-spacing:-.015em;font-variant-numeric:tabular-nums;color:var(--text);line-height:1.15;display:flex;}
/* odometer: each digit is a 20-row strip (0-9 twice); we slide it to digit+10 so every column spins one full loop */
.odo{display:inline-flex;}
.odo .d{display:block;height:1.15em;overflow:hidden;}
.odo .strip{display:block;transform:translateY(calc(var(--n,0)*-1.15em));transition:transform 1.05s cubic-bezier(.16,1,.3,1);transition-delay:var(--td,0ms);}
.odo .strip i{display:block;height:1.15em;line-height:1.15em;font-style:normal;text-align:center;}
.metric .l{font-size:var(--fs-2xs);color:var(--dim);margin-top:2px;font-weight:500;}
.metric.g .v{color:var(--green);} .metric.a .v{color:var(--amber);} .metric.r .v{color:var(--red);}

.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid color-mix(in srgb,var(--shadow-d) 55%,transparent);gap:10px;}
.row:last-child{border:none;padding-bottom:0;}
.row .label{display:flex;align-items:center;gap:10px;font-size:var(--fs-base);min-width:0;font-weight:500;}
.row .label svg{width:16px;height:16px;color:var(--mute);flex-shrink:0;}
.row .val{font-size:var(--fs-sm);color:var(--dim);font-variant-numeric:tabular-nums;}
.chip{font-size:var(--fs-2xs);font-weight:700;padding:4px 10px;border-radius:99px;flex-shrink:0;}
.chip.ok{background:var(--green-soft);color:var(--green);}
.chip.warn{background:var(--amber-soft);color:var(--amber);}
.chip.off{background:var(--red-soft);color:var(--red);}
.chip.muted{background:var(--bg);color:var(--faint);box-shadow:var(--sh-in-sm);}
.fix{font-size:var(--fs-xs);color:var(--brand);font-weight:700;flex-shrink:0;padding:3px 0 3px 8px;transition:opacity .15s;}
.fix:active{opacity:.5;}

.prov-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid color-mix(in srgb,var(--shadow-d) 55%,transparent);cursor:pointer;width:100%;text-align:left;}
.prov-row:last-child{border:none;padding-bottom:0;}
.prov-row.dis{opacity:.55;}
.prov-ic{width:38px;height:38px;border-radius:13px;flex-shrink:0;background:var(--bg);box-shadow:var(--sh-out-sm);display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans';font-weight:800;font-size:var(--fs-sm);color:var(--dim);overflow:hidden;}
.prov-ic.on{color:var(--brand);box-shadow:var(--sh-in-sm);}
.prov-ic.logo{background:#fff;box-shadow:var(--sh-out-sm);padding:7px;}
.prov-ic.logo svg{width:100%;height:100%;object-fit:contain;display:block;}
.prov-row.dis .prov-ic.logo{opacity:.5;}
.prov-body{flex:1;min-width:0;}
.prov-name{font-size:var(--fs-base);font-weight:600;letter-spacing:-.005em;}
.prov-name .soon{font-size:9.5px;font-weight:700;color:var(--faint);background:var(--bg);box-shadow:var(--sh-in-sm);padding:3px 7px;border-radius:99px;margin-left:7px;vertical-align:1px;letter-spacing:.02em;}
.prov-sub{font-size:var(--fs-xs);color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums;}

.filters{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding:3px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.f-chip{font-size:var(--fs-xs);font-weight:600;padding:7px 14px;border-radius:99px;flex-shrink:0;background:var(--bg);color:var(--dim);box-shadow:var(--sh-out-sm);transition:box-shadow .22s var(--ease-out),color .2s;}
.f-chip:active{transform:scale(.94);}
.f-chip.on{box-shadow:var(--sh-in-sm);color:var(--brand);font-weight:700;}
.f-chip .fcnt{font-family:'Roboto Mono';font-size:9.5px;opacity:.7;margin-left:5px;}

.queue-cta{display:flex;align-items:center;gap:12px;width:100%;text-align:left;}
.queue-cta .qc-l{flex:1;min-width:0;}
.queue-cta .qc-t{font-size:var(--fs-base);font-weight:700;}
.queue-cta .qc-s{font-size:var(--fs-2xs);color:var(--faint);margin-top:2px;}
.queue-cta .go{font-size:var(--fs-xs);font-weight:700;color:var(--brand);flex-shrink:0;}

/* pushed full-screen (queue manager, etc.) — Android-style, not a sheet */
.screen-overlay{position:fixed;inset:0;display:flex;justify-content:center;z-index:25;pointer-events:none;}
.screen-overlay.open{pointer-events:auto;}
.screen{width:100%;max-width:420px;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .34s var(--ease-spring);}
.screen-overlay.open .screen{transform:translateX(0);}
.screen-head{display:flex;align-items:center;gap:10px;padding:16px 14px 12px;flex-shrink:0;}
.screen-head .back{width:34px;height:34px;border-radius:12px;background:var(--bg);box-shadow:var(--sh-out-sm);display:flex;align-items:center;justify-content:center;color:var(--dim);flex-shrink:0;}
.screen-head .back:active{box-shadow:var(--sh-in-sm);transform:scale(.94);}
.screen-head h1{font-family:'Plus Jakarta Sans';font-size:var(--fs-lg);font-weight:700;margin:0;letter-spacing:-.008em;flex:1;min-width:0;}
.screen-body{flex:1;overflow-y:auto;padding:4px 14px 32px;scrollbar-width:none;}
.screen-body::-webkit-scrollbar{display:none;}

.q-item{padding:14px 0;border-bottom:1px solid color-mix(in srgb,var(--shadow-d) 55%,transparent);}
.q-item:last-child{border-bottom:none;}
.q-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
.q-trx{font-family:'Roboto Mono';font-size:var(--fs-sm);font-weight:700;letter-spacing:.04em;}
.q-age{font-size:var(--fs-2xs);color:var(--faint);font-variant-numeric:tabular-nums;flex-shrink:0;}
.q-reason{font-size:var(--fs-xs);color:var(--dim);margin-top:4px;line-height:1.45;}
.q-meta{display:flex;align-items:center;gap:8px;margin-top:9px;}
.q-attempt{font-size:var(--fs-2xs);font-weight:700;color:var(--amber);background:var(--amber-soft);padding:3px 9px;border-radius:99px;}
.q-retry{margin-left:auto;font-size:var(--fs-xs);font-weight:700;color:var(--brand);padding:6px 13px;border-radius:99px;background:var(--bg);box-shadow:var(--sh-out-sm);display:flex;align-items:center;gap:6px;}
.q-retry:active{box-shadow:var(--sh-in-sm);transform:scale(.96);}
.q-retry[disabled]{opacity:.55;pointer-events:none;}
.q-retry .spinner{width:11px;height:11px;}

.ev-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid color-mix(in srgb,var(--shadow-d) 55%,transparent);cursor:pointer;width:100%;text-align:left;}
.ev-row:last-child{border:none;padding-bottom:0;}
.ev-ic{width:30px;height:30px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.ev-ic svg{width:14px;height:14px;}
.ev-ic.ok{background:var(--green-soft);color:var(--green);}
.ev-ic.warn{background:var(--amber-soft);color:var(--amber);}
.ev-ic.off{background:var(--red-soft);color:var(--red);}
.ev-ic.recv{background:var(--bg);box-shadow:var(--sh-in-sm);color:var(--dim);}
.ev-body{flex:1;min-width:0;}
.ev-title{font-size:var(--fs-sm);font-weight:600;display:flex;justify-content:space-between;gap:8px;}
.ev-title .t{color:var(--faint);font-family:'Roboto Mono';font-size:var(--fs-2xs);flex-shrink:0;font-variant-numeric:tabular-nums;}
.ev-sub{font-size:var(--fs-2xs);color:var(--faint);margin-top:2px;font-family:'Roboto Mono';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.empty{padding:36px 16px;text-align:center;color:var(--faint);}
.empty svg{width:34px;height:34px;opacity:.5;color:var(--mute);margin-bottom:10px;}
.empty .et{font-size:var(--fs-sm);font-weight:600;color:var(--dim);}
.empty .es{font-size:var(--fs-xs);margin-top:3px;}

.field{margin-bottom:14px;}
.field label{font-size:var(--fs-xs);color:var(--dim);display:block;margin-bottom:7px;font-weight:600;}
.inputwrap{position:relative;}
input{width:100%;background:var(--bg);border:none;border-radius:var(--r-md);padding:12px 38px 12px 14px;color:var(--text);font-family:'Roboto Mono';font-size:var(--fs-sm);outline:none;box-shadow:var(--sh-in-sm);transition:box-shadow .2s;}
input:focus{box-shadow:var(--sh-in-md),0 0 0 2px var(--brand-soft);}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mute);cursor:pointer;width:15px;height:15px;padding:4px;transition:color .2s;}
.eye:hover{color:var(--dim);}
.btn{width:100%;border-radius:var(--r-md);padding:13px;font-weight:700;font-size:var(--fs-base);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--brand);background:var(--bg);box-shadow:var(--sh-out-md);transition:box-shadow .16s var(--ease-out),transform .16s var(--ease-out);}
.btn:active{box-shadow:var(--sh-in-md);transform:scale(.98);}
.btn.ghost{color:var(--text);box-shadow:var(--sh-out-sm);}
.btn.ghost:active{box-shadow:var(--sh-in-sm);}
.btn.danger{color:var(--red);box-shadow:var(--sh-out-sm);}
.btn.danger:active{box-shadow:var(--sh-in-sm);}
.btn[disabled]{opacity:.6;pointer-events:none;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}
.spinner{width:14px;height:14px;border:2px solid color-mix(in srgb,var(--brand) 35%,transparent);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;}
.btn.ghost .spinner{border-color:color-mix(in srgb,var(--dim) 35%,transparent);border-top-color:var(--dim);}
@keyframes spin{to{transform:rotate(360deg);}}
.note{font-size:var(--fs-2xs);color:var(--faint);margin-top:9px;line-height:1.55;}

/* overview v3 */
.metric-btn{display:block;width:100%;text-align:left;}
.metric-btn .go{display:none;}
.status-card.act{padding:2px 0;}
.status-card .grow{flex:1;min-width:0;}
.mini-btn{flex-shrink:0;font-size:var(--fs-xs);font-weight:700;color:var(--brand);padding:9px 14px;border-radius:99px;background:var(--bg);box-shadow:var(--sh-out-sm);transition:box-shadow .16s var(--ease-out),transform .16s var(--ease-out);}
.mini-btn:active{box-shadow:var(--sh-in-sm);transform:scale(.96);}
.card.tight{padding:16px 18px;}
.lasttx{display:flex;align-items:center;gap:13px;width:100%;text-align:left;}
.lasttx .prov-ic{width:42px;height:42px;}
.lasttx .lt-b{flex:1;min-width:0;}
.lasttx .amt{font-family:'Plus Jakarta Sans';font-weight:800;font-size:var(--fs-lg);letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.2;}
.lasttx .meta{font-size:var(--fs-2xs);color:var(--faint);font-family:'Roboto Mono';margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lasttx .lt-r{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.lasttx .ago{font-size:var(--fs-2xs);color:var(--faint);font-weight:500;}
.card h2 .cnt{font-family:'Roboto Mono';font-size:var(--fs-2xs);font-weight:700;padding:2px 8px;border-radius:99px;background:var(--red-soft);color:var(--red);}
.att{display:flex;align-items:center;gap:12px;padding:11px 0;width:100%;text-align:left;border-bottom:1px solid color-mix(in srgb,var(--shadow-d) 55%,transparent);}
.att:last-child{border:none;padding-bottom:0;}
.att:first-of-type{padding-top:0;}
.att .ev-ic{width:32px;height:32px;}
.att .ab{flex:1;min-width:0;}
.att .at{font-size:var(--fs-sm);font-weight:600;line-height:1.3;}
.att .as{font-size:var(--fs-2xs);color:var(--faint);margin-top:2px;line-height:1.4;}
.att .go{font-size:var(--fs-xs);font-weight:700;color:var(--brand);flex-shrink:0;padding-left:6px;}
.rate{margin-top:14px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--shadow-d) 55%,transparent);}
.rate-h{display:flex;align-items:baseline;justify-content:space-between;font-size:var(--fs-sm);font-weight:600;}
.rate-h b{font-family:'Plus Jakarta Sans';font-weight:800;font-size:var(--fs-md);color:var(--green);font-variant-numeric:tabular-nums;}
.rate-body{display:flex;align-items:flex-end;gap:14px;margin-top:10px;}
.track{flex:1;height:8px;border-radius:99px;background:var(--bg);box-shadow:var(--sh-in-sm);overflow:hidden;align-self:center;}
.track i{display:block;height:100%;width:0;border-radius:99px;background:var(--green);animation:fill 1s .35s var(--ease-out) forwards;}
@keyframes fill{to{width:var(--w);}}
.spark{display:flex;align-items:flex-end;gap:3px;height:26px;color:var(--green);}
.spark i{display:block;width:5px;border-radius:2px;background:currentColor;opacity:.75;}
.spark i.w{color:var(--amber);opacity:1;}
.mini-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.mini-stat{border-radius:var(--r-sm);padding:10px 12px;box-shadow:var(--sh-in-sm);}
.mini-stat .mv{font-family:'Plus Jakarta Sans';font-weight:800;font-size:var(--fs-md);font-variant-numeric:tabular-nums;}
.mini-stat .ml{font-size:var(--fs-2xs);color:var(--dim);margin-top:1px;font-weight:500;}
.dh-head{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:0;}
.dh-head h2{margin:0;flex:1;}
.dh .chev{width:16px;height:16px;color:var(--mute);transition:transform .35s var(--ease-spring);flex-shrink:0;}
.dh.open .chev{transform:rotate(180deg);}
.dh-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--ease-spring);}
.dh.open .dh-wrap{grid-template-rows:1fr;}
.dh-inner{overflow:hidden;min-height:0;opacity:0;transform:translateY(-6px);transition:opacity .25s var(--ease-out),transform .35s var(--ease-spring);}
.dh.open .dh-inner{opacity:1;transform:none;transition-delay:.05s;}
.dh-body{padding-top:6px;}
.dh-body .row:first-child{padding-top:10px;}
.row .label svg.i-ok{color:var(--green);} .row .label svg.i-warn{color:var(--amber);} .row .label svg.i-off{color:var(--red);}
@media (prefers-reduced-motion:reduce){.dh-wrap,.dh-inner,.dh .chev{transition:none;}}
.vstack .btn{margin-bottom:10px;} .vstack .btn:last-child{margin-bottom:0;}

.navbar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;z-index:10;pointer-events:none;}
.navbar-inner{pointer-events:auto;width:100%;max-width:420px;position:relative;background:var(--bg);display:flex;padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));margin:0 10px calc(10px + env(safe-area-inset-bottom,0px));border-radius:var(--r-lg);box-shadow:var(--sh-out-lg);}
.navbar-inner{margin-bottom:calc(10px + env(safe-area-inset-bottom,0px));}
.nav-ind{position:absolute;top:8px;bottom:8px;width:calc(25% - 8px);left:8px;background:var(--bg);border-radius:var(--r-sm);box-shadow:var(--sh-in-sm);transition:transform .32s var(--ease-spring);pointer-events:none;}
.nav-btn{flex:1;position:relative;z-index:1;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:var(--fs-2xs);font-weight:600;padding:5px 0;transition:color .25s;}
.nav-btn svg{width:20px;height:20px;transition:transform .28s var(--ease-spring);}
.nav-btn.on{color:var(--brand);}
.nav-btn.on svg{transform:translateY(-1px);}
.nav-btn:active svg{transform:scale(.85);}

.overlay{position:fixed;inset:0;background:rgba(4,7,14,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .28s var(--ease-out);}
.overlay.open{opacity:1;pointer-events:auto;}
.sheet{width:100%;max-width:420px;margin-top:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));max-height:82vh;overflow-y:auto;scrollbar-width:none;transform:translateY(102%);transition:transform .38s var(--ease-spring);box-shadow:var(--sh-out-lg);}
.sheet::-webkit-scrollbar{display:none;}
.overlay.open .sheet{transform:translateY(0);}
.grab{width:38px;height:4px;border-radius:99px;background:var(--shadow-d);margin:4px auto 12px;}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;gap:10px;}
.sheet-head h3{font-family:'Plus Jakarta Sans';font-size:var(--fs-md);font-weight:700;margin:0;letter-spacing:-.008em;flex:1;}
.sheet-head .x{width:30px;height:30px;border-radius:11px;background:var(--bg);box-shadow:var(--sh-out-sm);color:var(--dim);font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:box-shadow .15s,transform .15s;}
.sheet-head .x:active{box-shadow:var(--sh-in-sm);transform:scale(.9);}
.stage{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:var(--fs-sm);font-weight:500;}
.stage .sd{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.stage .sd.done{background:var(--green);} .stage .sd.pend{background:var(--amber);animation:blink 1.6s ease infinite;}
.stage .sd.wait{background:var(--mute);opacity:.5;} .stage .sd.fail{background:var(--red);}
@keyframes blink{50%{opacity:.35;}}
.stage .st{color:var(--faint);font-family:'Roboto Mono';font-size:var(--fs-2xs);margin-left:auto;font-variant-numeric:tabular-nums;}

.toast-wrap{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;z-index:30;pointer-events:none;}
.toast{background:var(--bg);color:var(--text);font-size:var(--fs-sm);font-weight:600;padding:10px 17px;border-radius:99px;box-shadow:var(--sh-out-md);display:flex;align-items:center;gap:8px;max-width:86%;opacity:0;transform:translateY(12px) scale(.95);transition:opacity .3s var(--ease-out),transform .3s var(--ease-spring);}
.toast.show{opacity:1;transform:none;}
.toast .tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.toast .tdot.g{background:var(--green);} .toast .tdot.a{background:var(--amber);} .toast .tdot.r{background:var(--red);}

.sk{border-radius:var(--r-lg);background:var(--bg);box-shadow:var(--sh-out-sm);padding:18px;margin-bottom:16px;}
.sk .ln{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--shadow-d) 25%,var(--shadow-l) 50%,var(--shadow-d) 75%);background-size:200% 100%;animation:shim 1.3s linear infinite;}
@keyframes shim{to{background-position:-200% 0;}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
@media (min-width:700px){.pressable:hover{opacity:.85;}}

/* ---------- derived readiness/pill ----------
   Real signal, not a hard-coded label: blocked beats offline beats degraded beats operational. */
function computeStatus(){
  const smsDenied = S.demo==='denied';
  const offline = S.demo==='offline';
  if(smsDenied) return {cls:'off',label:'Blocked'};
  if(offline) return {cls:'off',label:'Offline'};
  const netWarn = S.health.find(h=>h.id==='net')?.state==='warn';
  const hasFailed = S.events.some(e=>e.kind==='failed');
  if(netWarn||hasFailed||S.metrics.pending>0) return {cls:'deg',label:'Degraded'};
  return {cls:'op',label:'Operational'};
}
function updatePill(){
  const st=computeStatus(), p=$('#topPill');
  if(!p) return;
  p.className='pill '+st.cls; p.textContent=st.label;
}

let swapToken=0;
/* Renders content with a short crossfade instead of an instant swap.
   Nav highlight/indicator is updated separately, before this is called,
   so the tap feels instant even while the content fades in behind it. */
function renderView(v){
  const my=++swapToken;
  content.classList.add('leaving');
  setTimeout(()=>{
    if(my!==swapToken) return; // a newer tap superseded this one
    if(viewCache[v]==null) viewCache[v]=VIEWS[v]();
    content.innerHTML=viewCache[v];
    content.scrollTop=scrollMem[v]||0;
    requestAnimationFrame(()=>content.classList.remove('leaving'));
    if(v==='overview') animateCounts();
    updatePill();
  },130);
}
function setView(v){
  if(v!==S.view){
    scrollMem[S.view]=content.scrollTop;
    navBtns.forEach((b,i)=>{
      b.classList.toggle('on',b.dataset.v===v);
      if(b.dataset.v===v) navInd.style.transform=`translateX(calc(${i} * (100% + 4px)))`;
    });
    S.view=v;
  }
  renderView(v);
}
navBtns.forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));

/* ---------- count-up ---------- */
function animateCounts(){
  // two frames so the zero-state paints first, then the CSS transition rolls each digit into place
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    $$('#content .strip').forEach(s=>s.style.setProperty('--n',s.dataset.n));
  }));
}

/* ---------- global delegated events ---------- */
document.addEventListener('click',e=>{
  const tg=e.target.closest('[data-toggle="dh"]');
  if(tg){const c=tg.closest('.dh'); const o=c.classList.toggle('open'); tg.setAttribute('aria-expanded',o); S.dhOpen=o; viewCache.overview=null; return;}
  const close=e.target.closest('[data-close]');
  if(close){closeSheet();return;}
  if(e.target===overlay){closeSheet();return;}
  const scrClose=e.target.closest('[data-screen-close]');
  if(scrClose){closeScreen();return;}
  if(e.target===screenOverlay){closeScreen();return;}
  const scr=e.target.closest('[data-view]');
  if(scr){openScreen(scr.dataset.view);return;}
  const qr=e.target.closest('[data-qretry]');
  if(qr){retryQueueItem(qr.dataset.qretry,qr);return;}
  if(e.target.closest('#retryAllBtn')){retryAllQueue($('#retryAllBtn'));return;}
  const sh=e.target.closest('[data-sheet]');
  if(sh){openSheet(sh.dataset.sheet);return;}
  const f=e.target.closest('[data-filter]');
  if(f){S.filter=f.dataset.filter; viewCache.activity=null; setView('activity'); return;}
  const tc=e.target.closest('[data-toast]');
  if(tc){const [msg,tone]=tc.dataset.toast.split('|');toast(msg,tone);return;}
  const dm=e.target.closest('[data-demo]');
  if(dm){
    S.demo=dm.dataset.demo;
    if(S.demo==='loading'){content.innerHTML=skeleton(); setTimeout(()=>{S.demo=''; viewCache.overview=null; viewCache.settings=null; setView(S.view);},900); return;}
    if(S.demo==='empty'){S.filter='received'; viewCache.activity=null; setView('activity'); toast('Empty state — no received events','a'); return;}
    viewCache.overview=null; viewCache.settings=null; setView(S.view); return;}
  const act=e.target.closest('[data-act]');
  if(act){
    if(act.dataset.act==='fix-net') toast('Opening battery & network settings…','a');
    if(act.dataset.act==='fix-sms') toast('Opening SMS permission settings…','r');
    if(act.dataset.act==='clear-history'){closeSheet();toast('Local history cleared','g');}
    return;}
  if(e.target.closest('#eyeBtn')){
    S.tokenVisible=!S.tokenVisible;
    $('#tokenInput').type=S.tokenVisible?'text':'password';
    return;}
  if(e.target.closest('#testConn')){
    const b=$('#testConn'); if(b.disabled) return;
    b.disabled=true;
    b.innerHTML='<span class="spinner"></span>Testing…';
    setTimeout(()=>{
      b.disabled=false;
      b.innerHTML=`${svg('<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',15)}Test connection`;
      toast('Connected · relay endpoint OK','g');
    },1400);
    return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeScreen();}});

/* ---------- boot: skeleton → content ---------- */
function skeleton(){
  return `<div class="sk"><div class="ln" style="width:45%;height:14px"></div><div class="ln" style="width:75%;margin-top:12px"></div></div>
  <div class="sk"><div class="ln" style="width:35%"></div><div class="ln" style="width:100%;margin-top:12px"></div><div class="ln" style="width:100%;margin-top:8px"></div></div>`;
}
content.innerHTML=skeleton();
setTimeout(()=>setView('overview'),450);
</script>
